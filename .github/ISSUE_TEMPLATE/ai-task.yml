name: AI implementation task
description: One bounded GitHub-only implementation request
title: "[Task] "
body:
  - type: markdown
    attributes:
      value: |
        GitHub-direct implementation and exact-head GitHub coordinator review are the default. Codex and Claude are optional helpers only.
  - type: checkboxes
    id: startup_acceptance
    attributes:
      label: Repository startup acceptance
      description: Confirm non-secret Phase 0 evidence for this exact repository before product work.
      options:
        - label: Connected GitHub access, Actions/Foundation workflows, Workflow permissions, and harmless Bootstrap acceptance are complete.
          required: true
        - label: Read and write permissions is selected and Allow GitHub Actions to create and approve pull requests is enabled.
          required: true
  - type: textarea
    id: startup_evidence
    attributes:
      label: Non-secret Phase 0 evidence reference
      description: Provide the acceptance Issue/PR, exact head SHA, successful checks, and coordinator-review reference. Do not provide credentials or Secret values.
    validations:
      required: true
  - type: textarea
    id: goal
    attributes:
      label: Goal
    validations:
      required: true
  - type: dropdown
    id: risk_tier
    attributes:
      label: Risk tier
      options:
        - low
        - standard
        - protected
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Allowed paths
      description: List exact repository-relative paths or bounded suffix patterns such as tests/**.
      placeholder: |
        - scripts/example.py
        - tests/**
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Required checks
      description: List exact workflow/check names. Foundation defaults are CI and Unit Tests.
      value: |
        - CI
        - Unit Tests
    validations:
      required: true
  - type: textarea
    id: prohibited
    attributes:
      label: Prohibited effects
      description: State forbidden permissions, Secret/OIDC use, deployments, settings, billing, production, destructive effects, and scope expansion.
    validations:
      required: true
  - type: textarea
    id: rollback
    attributes:
      label: Rollback
      description: State the history-preserving rollback procedure.
      value: Revert the eventual merge commit; never force-rewrite shared history.
    validations:
      required: true
  - type: textarea
    id: protected_authorization
    attributes:
      label: Protected authorization when applicable
      description: For protected work, include one foundation-protected-authorization block with category, exact paths, operation, prohibited, validation, and rollback.
      render: markdown
  - type: checkboxes
    id: optional_provider
    attributes:
      label: Optional provider route
      description: Leave unchecked for normal GitHub-only development.
      options:
        - label: I explicitly request an optional provider helper for this Issue. Provider unavailability must remain non-blocking.
          required: false
