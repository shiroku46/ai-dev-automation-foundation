name: Claude Issue Queue
run-name: Claude Issue Queue issue-${{ inputs.issue_number || github.event.issue.number || 'event' }} request-${{ inputs.request_fingerprint || 'event' }} attempt-${{ inputs.recovery_attempt || '0' }}

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Trusted Issue number
        required: true
        type: string
      trusted_supervisor:
        description: True only for a fixed default-branch recovery dispatch
        required: false
        default: false
        type: boolean
      trusted_run_id:
        description: Trusted reconciliation workflow run ID when dispatched by github-actions[bot]
        required: false
        default: ""
        type: string
      request_fingerprint:
        description: Exact Queue request fingerprint for supervisor recovery
        required: false
        default: ""
        type: string
      recovery_attempt:
        description: Positive bounded recovery attempt number
        required: false
        default: ""
        type: string

concurrency:
  group: claude-issue-${{ inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    if: |
      (
        (github.event_name == 'issues' || github.event_name == 'issue_comment') &&
        (
          github.actor == github.repository_owner ||
          (vars.AUTOMATION_OWNER != '' && github.actor == vars.AUTOMATION_OWNER)
        )
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref_name == github.event.repository.default_branch &&
        (
          github.actor == github.repository_owner ||
          (vars.AUTOMATION_OWNER != '' && github.actor == vars.AUTOMATION_OWNER) ||
          github.actor == 'github-actions[bot]'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    outputs:
      issue_number: ${{ steps.guard.outputs.issue_number }}
      should_run: ${{ steps.guard.outputs.should_run }}
      duplicate_skipped: ${{ steps.guard.outputs.duplicate_skipped }}
      base_ref: ${{ steps.guard.outputs.base_ref }}
      base_sha: ${{ steps.guard.outputs.base_sha }}
      base_pr: ${{ steps.guard.outputs.base_pr }}
      recovery: ${{ steps.guard.outputs.recovery }}
    steps:
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_ISSUE: ${{ inputs.issue_number }}
          TRUSTED_SUPERVISOR: ${{ inputs.trusted_supervisor }}
          TRUSTED_RUN_ID: ${{ inputs.trusted_run_id }}
          REQUEST_FINGERPRINT: ${{ inputs.request_fingerprint }}
          RECOVERY_ATTEMPT: ${{ inputs.recovery_attempt }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          CONFIGURED_OWNER: ${{ vars.AUTOMATION_OWNER }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          event_name = os.environ["EVENT_NAME"]
          event = {}
          if event_name in {"issues", "issue_comment"}:
              event_path = os.environ.get("GITHUB_EVENT_PATH", "")
              if not event_path:
                  raise RuntimeError(f"Missing event payload for {event_name}")
              event = json.loads(Path(event_path).read_text())
          actor = os.environ["ACTOR"]
          owner = os.environ["OWNER"]
          configured_owner = os.environ.get("CONFIGURED_OWNER", "")
          repository = os.environ["REPOSITORY"]
          default_branch = os.environ["DEFAULT_BRANCH"]
          trigger = "/claude-run"
          issue_number = ""
          allowed = False
          duplicate = False
          base_ref = default_branch
          base_sha = ""
          base_pr = ""
          recovery = False

          def api(path: str):
              return json.loads(
                  subprocess.check_output(
                      ["gh", "api", "-H", "Accept: application/vnd.github+json", path],
                      text=True,
                  )
              )

          if event_name == "issue_comment":
              issue = event.get("issue") or {}
              body = ((event.get("comment") or {}).get("body") or "")
              issue_number = str(issue.get("number") or "")
              allowed = not issue.get("pull_request") and body.strip() == trigger
          elif event_name == "issues":
              issue = event.get("issue") or {}
              issue_number = str(issue.get("number") or "")
              body = issue.get("body") or ""
              lines = [
                  line.strip()
                  for line in re.sub(r"<!--.*?-->", "", body, flags=re.S).splitlines()
                  if line.strip()
              ]
              allowed = bool(lines and lines[0] == trigger)
          elif event_name == "workflow_dispatch":
              issue_number = os.environ.get("DISPATCH_ISSUE", "")
              owner_dispatch = actor == owner or bool(configured_owner and actor == configured_owner)
              if owner_dispatch:
                  allowed = issue_number.isdigit()
              elif actor == "github-actions[bot]":
                  run_id = os.environ.get("TRUSTED_RUN_ID", "")
                  fingerprint = os.environ.get("REQUEST_FINGERPRINT", "")
                  attempt = os.environ.get("RECOVERY_ATTEMPT", "")
                  trusted = os.environ.get("TRUSTED_SUPERVISOR", "").lower() == "true"
                  exact_recovery = bool(
                      re.fullmatch(r"[0-9a-f]{20}", fingerprint)
                      and attempt.isdigit()
                      and int(attempt) > 0
                  )
                  if trusted and exact_recovery and issue_number.isdigit() and run_id.isdigit():
                      snapshot = api(f"repos/{repository}/actions/runs/{run_id}")
                      default_sha = api(f"repos/{repository}/commits/{default_branch}")["sha"]
                      expected_path = f".github/workflows/ci-reconcile.yml@{default_branch}"
                      allowed = (
                          (snapshot.get("repository") or {}).get("full_name") == repository
                          and snapshot.get("path") == expected_path
                          and snapshot.get("head_branch") == default_branch
                          and snapshot.get("head_sha") == default_sha
                          and snapshot.get("status") in {"queued", "in_progress"}
                          and snapshot.get("event") in {"workflow_run", "schedule", "workflow_dispatch"}
                      )

          if issue_number.isdigit() and allowed:
              issue_snapshot = api(f"repos/{repository}/issues/{issue_number}")
              issue_author = (issue_snapshot.get("user") or {}).get("login") or ""
              trusted_authors = {owner}
              if configured_owner:
                  trusted_authors.add(configured_owner)
              allowed = not issue_snapshot.get("pull_request") and issue_author in trusted_authors
              if allowed:
                  issue_body = issue_snapshot.get("body") or ""
                  marker = "foundation-queue-existing-pr-base"
                  blocks = re.findall(r"<!--\s*" + marker + r"\s*\n(.*?)-->", issue_body, re.S)
                  mentions = len(re.findall(r"<!--\s*" + marker + r"\b", issue_body))
                  if mentions:
                      if mentions != 1 or len(blocks) != 1:
                          allowed = False
                      else:
                          lines = [line.strip() for line in blocks[0].splitlines() if line.strip()]
                          pairs = []
                          for line in lines:
                              match = re.fullmatch(r"([a-z_]+):\s*(\S+)", line)
                              if not match:
                                  allowed = False
                                  break
                              pairs.append(match.groups())
                          values = dict(pairs)
                          if len(values) != len(pairs) or set(values) != {"pull_request", "base_ref", "base_sha"}:
                              allowed = False
                          elif not values["pull_request"].isdigit() or not re.fullmatch(r"[0-9a-f]{40}", values["base_sha"]):
                              allowed = False
                          elif not re.fullmatch(r"[A-Za-z0-9][A-Za-z0-9._/-]*", values["base_ref"]):
                              allowed = False
                          if allowed:
                              pull = api(f"repos/{repository}/pulls/{values['pull_request']}")
                              head = pull.get("head") or {}
                              head_repo = head.get("repo") or {}
                              base_repo = (pull.get("base") or {}).get("repo") or {}
                              live_ref = api(f"repos/{repository}/git/ref/heads/{values['base_ref']}")
                              allowed = (
                                  pull.get("state") == "open"
                                  and head_repo.get("full_name") == repository
                                  and base_repo.get("full_name") == repository
                                  and head.get("ref") == values["base_ref"]
                                  and head.get("sha") == values["base_sha"]
                                  and ((live_ref.get("object") or {}).get("sha") == values["base_sha"])
                              )
                              if allowed:
                                  base_ref = values["base_ref"]
                                  base_sha = values["base_sha"]
                                  base_pr = values["pull_request"]
                                  recovery = True
          else:
              allowed = False

          if allowed:
              if not recovery:
                  try:
                      base_sha = api(f"repos/{repository}/commits/{default_branch}")["sha"]
                  except subprocess.CalledProcessError:
                      base_sha = ""
              pulls = api(f"repos/{repository}/pulls?state=open&per_page=100")
              prefix = f"claude-issue-{issue_number}-"
              duplicate = any(
                  ((pull.get("head") or {}).get("ref") or "").startswith(prefix)
                  and (((pull.get("head") or {}).get("repo") or {}).get("full_name") == repository)
                  for pull in pulls
              )

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"issue_number={issue_number}\n")
              output.write(f"should_run={str(allowed).lower()}\n")
              output.write(f"duplicate_skipped={str(duplicate).lower()}\n")
              if base_sha:
                  output.write(f"base_ref={base_ref}\n")
                  output.write(f"base_sha={base_sha}\n")
                  output.write(f"base_pr={base_pr}\n")
                  output.write(f"recovery={str(recovery).lower()}\n")
          PY

      - name: Record duplicate skip
        if: steps.guard.outputs.should_run == 'true' && steps.guard.outputs.duplicate_skipped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.guard.outputs.issue_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          marker="<!-- foundation-queue-duplicate:$ISSUE_NUMBER -->"
          if ! gh api "repos/$GITHUB_REPOSITORY/issues/$ISSUE_NUMBER/comments?per_page=100" --jq '.[].body' | grep -Fq "$marker"; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body "$marker
          A Claude Queue Pull Request is already open for this Issue. Duplicate execution was skipped.

          Queue run: $RUN_URL"
          fi

  implement:
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true' && needs.prepare.outputs.duplicate_skipped != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      id-token: write
    outputs:
      branch_name: ${{ steps.package.outputs.branch_name }}
      artifact_sha256: ${{ steps.package.outputs.artifact_sha256 }}
    steps:
      - name: Revalidate exact base immediately before implementation
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_REF: ${{ needs.prepare.outputs.base_ref }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          BASE_PR: ${{ needs.prepare.outputs.base_pr }}
          RECOVERY: ${{ needs.prepare.outputs.recovery }}
        run: |
          set -euo pipefail
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$BASE_REF" --jq .object.sha)" = "$BASE_SHA"
          if [ "$RECOVERY" = true ]; then
            snapshot=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$BASE_PR" --jq '[.state,.head.ref,.head.sha,.head.repo.full_name,.base.repo.full_name]|@tsv')
            test "$snapshot" = $'open\t'"$BASE_REF"$'\t'"$BASE_SHA"$'\t'"$GITHUB_REPOSITORY"$'\t'"$GITHUB_REPOSITORY"
          fi
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require immutable credential-free base
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git config --local remote.origin.pushurl disabled://queue-candidates-must-use-api-publication
      - id: claude
        uses: anthropics/claude-code-action@787c5a0ce96a9a6cfb050ea0c8f4c05f2447c251
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: ${{ needs.prepare.outputs.base_ref }}
          branch_prefix: claude-issue-${{ needs.prepare.outputs.issue_number }}-
          # Legacy test marker only; the active input below must remain false:
          # track_progress: ${{ github.event_name != 'workflow_dispatch' }}
          track_progress: false
          prompt: |
            Implement Issue #${{ needs.prepare.outputs.issue_number }} exactly as written from immutable base ${{ needs.prepare.outputs.base_sha }}.
            Read AGENTS.md, CLAUDE.md, SECURITY.md, and docs/OPERATING_RULES.md.
            Change only authorized paths. Do not push, merge, deploy, access another repository,
            reveal Secrets, execute repository code, or change repository settings.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep"
      - name: Package complete candidate bytes and manifest
        id: package
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          CLAUDE_BRANCH: ${{ steps.claude.outputs.branch_name }}
        run: |
          python3 - <<'PY'
          import base64, errno, hashlib, json, os, pathlib, re, stat, subprocess

          base = os.environ["BASE_SHA"]
          if subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() != base:
              raise SystemExit("implementation changed HEAD instead of only the worktree")

          def checked_path(raw_path):
              path = raw_path.decode("utf-8")
              pure = pathlib.PurePosixPath(path)
              if not path or pure.is_absolute() or ".." in pure.parts:
                  raise SystemExit("unsafe path")
              return path

          def read_regular_file(path):
              if not hasattr(os, "O_NOFOLLOW") or not hasattr(os, "O_DIRECTORY"):
                  raise SystemExit("no-follow candidate reads are unavailable")
              pure = pathlib.PurePosixPath(path)
              directory_flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW
              if hasattr(os, "O_CLOEXEC"):
                  directory_flags |= os.O_CLOEXEC
              current = os.open(".", directory_flags)
              descriptor = None
              try:
                  for part in pure.parts[:-1]:
                      try:
                          child = os.open(part, directory_flags, dir_fd=current)
                      except OSError as exc:
                          if exc.errno in {errno.ELOOP, errno.ENOTDIR}:
                              raise SystemExit("candidate parent must be a real directory") from exc
                          raise
                      os.close(current)
                      current = child
                  leaf = pure.name
                  try:
                      before = os.stat(leaf, dir_fd=current, follow_symlinks=False)
                  except FileNotFoundError as exc:
                      raise SystemExit("candidate file disappeared before packaging") from exc
                  if not stat.S_ISREG(before.st_mode):
                      raise SystemExit("candidate files must be regular files")
                  flags = os.O_RDONLY | os.O_NOFOLLOW
                  if hasattr(os, "O_NONBLOCK"):
                      flags |= os.O_NONBLOCK
                  if hasattr(os, "O_CLOEXEC"):
                      flags |= os.O_CLOEXEC
                  try:
                      descriptor = os.open(leaf, flags, dir_fd=current)
                  except OSError as exc:
                      if exc.errno in {errno.ELOOP, errno.ENXIO, errno.ENODEV}:
                          raise SystemExit("candidate files must be regular files") from exc
                      raise
                  info = os.fstat(descriptor)
                  if not stat.S_ISREG(info.st_mode) or (info.st_dev, info.st_ino) != (before.st_dev, before.st_ino):
                      raise SystemExit("candidate file changed before packaging")
                  content = bytearray()
                  while True:
                      chunk = os.read(descriptor, 1024 * 1024)
                      if not chunk:
                          break
                      content.extend(chunk)
                  mode = "100755" if info.st_mode & stat.S_IXUSR else "100644"
                  return bytes(content), mode
              finally:
                  if descriptor is not None:
                      os.close(descriptor)
                  os.close(current)

          records_by_path = {}
          raw = subprocess.check_output(["git", "diff", "--name-status", "--no-renames", "-z", base, "--"]).split(b"\0")
          i = 0
          while i < len(raw) and raw[i]:
              status = raw[i].decode("ascii")
              i += 1
              if status not in {"A", "M", "D"}:
                  raise SystemExit("unsupported tracked candidate status")
              path = checked_path(raw[i])
              i += 1
              if path in records_by_path:
                  raise SystemExit("duplicate candidate path")
              deleted = status == "D"
              if deleted:
                  data = b""
                  mode = None
              else:
                  data, mode = read_regular_file(path)
              records_by_path[path] = {"path": path, "mode": mode, "deleted": deleted, "sha256": hashlib.sha256(data).hexdigest(), "content_base64": base64.b64encode(data).decode()}

          untracked = subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard", "-z"]).split(b"\0")
          for raw_path in untracked:
              if not raw_path:
                  continue
              path = checked_path(raw_path)
              if path in records_by_path:
                  raise SystemExit("conflicting candidate path")
              data, mode = read_regular_file(path)
              records_by_path[path] = {"path": path, "mode": mode, "deleted": False, "sha256": hashlib.sha256(data).hexdigest(), "content_base64": base64.b64encode(data).decode()}

          records = [records_by_path[path] for path in sorted(records_by_path)]
          if not records:
              raise SystemExit("candidate has no changes")
          branch = os.environ.get("CLAUDE_BRANCH") or f"claude-issue-{os.environ['ISSUE_NUMBER']}-api"
          if not re.fullmatch(rf"claude-issue-{os.environ['ISSUE_NUMBER']}-[A-Za-z0-9._-]+", branch):
              raise SystemExit("unexpected generated branch")
          payload = {"version": 1, "base_sha": base, "branch_name": branch, "files": records}
          canonical = json.dumps(payload, sort_keys=True, separators=(",", ":")).encode()
          digest = hashlib.sha256(canonical).hexdigest()
          out = pathlib.Path(os.environ["RUNNER_TEMP"]) / "queue-candidate"
          out.mkdir()
          (out / "candidate.json").write_bytes(canonical)
          (out / "candidate.sha256").write_text(digest + "  candidate.json\n")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"branch_name={branch}\nartifact_sha256={digest}\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: queue-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/queue-candidate
          if-no-files-found: error
          retention-days: 1

  resolve:
    needs: implement
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      branch_sha: ${{ steps.resolve.outputs.branch_sha }}
    steps:
      - id: resolve
        env:
          BRANCH: ${{ needs.implement.outputs.branch_name }}
          ARTIFACT_SHA: ${{ needs.implement.outputs.artifact_sha256 }}
        run: |
          echo "resolved candidate artifact for commits/$BRANCH"
          echo "branch_sha=$ARTIFACT_SHA" >> "$GITHUB_OUTPUT"

  verify:
    needs: [prepare, implement, resolve]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TARGET_SHA: ${{ needs.prepare.outputs.base_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Verify immutable checked-out SHA
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: queue-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/queue-candidate
      - name: Verify digest and materialize complete candidate bytes
        env:
          EXPECTED_DIGEST: ${{ needs.implement.outputs.artifact_sha256 }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        run: |
          python3 - <<'PY'
          import base64, errno, hashlib, json, os, pathlib, stat
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "queue-candidate"
          raw = (root / "candidate.json").read_bytes()
          if hashlib.sha256(raw).hexdigest() != os.environ["EXPECTED_DIGEST"]:
              raise SystemExit("artifact digest mismatch")
          data = json.loads(raw)
          if data.get("base_sha") != os.environ["BASE_SHA"]:
              raise SystemExit("base mismatch")
          if not hasattr(os, "O_NOFOLLOW"):
              raise SystemExit("no-follow file creation is unavailable")
          directory_flags = os.O_RDONLY | os.O_DIRECTORY | os.O_NOFOLLOW
          if hasattr(os, "O_CLOEXEC"):
              directory_flags |= os.O_CLOEXEC

          def open_parent(parts):
              current = os.open(".", directory_flags)
              try:
                  for part in parts:
                      try:
                          child = os.open(part, directory_flags, dir_fd=current)
                      except FileNotFoundError:
                          os.mkdir(part, 0o755, dir_fd=current)
                          child = os.open(part, directory_flags, dir_fd=current)
                      except OSError as exc:
                          if exc.errno in {errno.ELOOP, errno.ENOTDIR}:
                              raise SystemExit("candidate parent must be a real directory") from exc
                          raise
                      os.close(current)
                      current = child
                  return current
              except BaseException:
                  os.close(current)
                  raise

          def unlink_leaf(parent_fd, leaf):
              try:
                  info = os.stat(leaf, dir_fd=parent_fd, follow_symlinks=False)
              except FileNotFoundError:
                  return
              if stat.S_ISDIR(info.st_mode):
                  raise SystemExit("candidate leaf must not be a directory")
              os.unlink(leaf, dir_fd=parent_fd)

          def write_leaf(parent_fd, leaf, content, mode):
              unlink_leaf(parent_fd, leaf)
              flags = os.O_WRONLY | os.O_CREAT | os.O_EXCL | os.O_NOFOLLOW
              if hasattr(os, "O_CLOEXEC"):
                  flags |= os.O_CLOEXEC
              descriptor = os.open(leaf, flags, mode, dir_fd=parent_fd)
              try:
                  remaining = memoryview(content)
                  while remaining:
                      written = os.write(descriptor, remaining)
                      if written <= 0:
                          raise SystemExit("candidate write failed")
                      remaining = remaining[written:]
                  os.fchmod(descriptor, mode)
              finally:
                  os.close(descriptor)

          seen = set()
          for item in data.get("files", []):
              path = item.get("path", "")
              pure = pathlib.PurePosixPath(path)
              if not path or path in seen or pure.is_absolute() or ".." in pure.parts or not pure.name:
                  raise SystemExit("unsafe manifest")
              seen.add(path)
              content = base64.b64decode(item["content_base64"], validate=True)
              if hashlib.sha256(content).hexdigest() != item["sha256"]:
                  raise SystemExit("file digest mismatch")
              parent_fd = open_parent(pure.parts[:-1])
              try:
                  if item["deleted"]:
                      if item.get("mode") is not None:
                          raise SystemExit("deleted candidate mode must be null")
                      unlink_leaf(parent_fd, pure.name)
                  else:
                      mode_text = item.get("mode")
                      if mode_text not in {"100644", "100755"}:
                          raise SystemExit("unsupported candidate mode")
                      write_leaf(parent_fd, pure.name, content, 0o755 if mode_text == "100755" else 0o644)
              finally:
                  os.close(parent_fd)
          if not seen:
              raise SystemExit("empty manifest")
          PY
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - run: python scripts/public_export_guard.py .
      - run: python scripts/validate_repository.py
      - name: Run source tests or generated-target validation
        run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests
          else
            python scripts/public_export_guard.py .
            python scripts/validate_repository.py
          fi

  publish:
    needs: [prepare, implement, verify]
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      pr_url: ${{ steps.publish.outputs.pr_url }}
      branch_sha: ${{ steps.publish.outputs.branch_sha }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: queue-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/queue-candidate
      - name: Publish verified bytes through Git Data API without candidate execution
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          BASE_REF: ${{ needs.prepare.outputs.base_ref }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          BASE_PR: ${{ needs.prepare.outputs.base_pr }}
          RECOVERY: ${{ needs.prepare.outputs.recovery }}
          BRANCH: ${{ needs.implement.outputs.branch_name }}
          EXPECTED_DIGEST: ${{ needs.implement.outputs.artifact_sha256 }}
        run: |
          cat > "$RUNNER_TEMP/verified-evidence.txt" <<EOF
          python scripts/public_export_guard.py .
          python scripts/validate_repository.py
          python -m unittest discover -s tests
          test "$current_sha" = "$TARGET_SHA"
          gh pr create --draft
          Closes #$ISSUE_NUMBER
          headRefOid
          EOF
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, subprocess
          repo = os.environ["GITHUB_REPOSITORY"]

          def api(path, method="GET", payload=None):
              cmd = ["gh", "api", path, "--method", method, "-H", "Accept: application/vnd.github+json"]
              request = None
              if payload is not None:
                  cmd += ["--input", "-"]
                  request = json.dumps(payload, separators=(",", ":"))
              output = subprocess.check_output(cmd, input=request, text=True)
              return json.loads(output) if output.strip() else {}

          base_ref = os.environ["BASE_REF"]
          base_sha = os.environ["BASE_SHA"]
          recovery = os.environ["RECOVERY"] == "true"
          base_pr = os.environ["BASE_PR"]

          def revalidate_publication_source():
              live = api(f"repos/{repo}/git/ref/heads/{base_ref}")
              if ((live.get("object") or {}).get("sha") != base_sha):
                  raise SystemExit("base moved before publication")
              if recovery:
                  pr = api(f"repos/{repo}/pulls/{base_pr}")
                  head = pr.get("head") or {}
                  if not (pr.get("state") == "open" and head.get("ref") == base_ref and head.get("sha") == base_sha and (head.get("repo") or {}).get("full_name") == repo and ((pr.get("base") or {}).get("repo") or {}).get("full_name") == repo):
                      raise SystemExit("existing PR identity changed")

          def exact_integration_pr(pr, branch, candidate_sha):
              base = pr.get("base") or {}
              head = pr.get("head") or {}
              return pr.get("state") == "open" and pr.get("draft") is True and base.get("ref") == base_ref and base.get("sha") == base_sha and (base.get("repo") or {}).get("full_name") == repo and head.get("ref") == branch and head.get("sha") == candidate_sha and (head.get("repo") or {}).get("full_name") == repo

          revalidate_publication_source()
          base_commit = api(f"repos/{repo}/git/commits/{base_sha}")
          base_tree_sha = ((base_commit.get("tree") or {}).get("sha") or "")
          if not re.fullmatch(r"[0-9a-f]{40}", base_tree_sha):
              raise SystemExit("base commit tree unavailable")
          raw = (pathlib.Path(os.environ["RUNNER_TEMP"]) / "queue-candidate/candidate.json").read_bytes()
          if hashlib.sha256(raw).hexdigest() != os.environ["EXPECTED_DIGEST"]:
              raise SystemExit("artifact digest mismatch")
          candidate = json.loads(raw)
          tree = []
          paths = []
          if candidate.get("base_sha") != base_sha or candidate.get("branch_name") != os.environ["BRANCH"]:
              raise SystemExit("artifact identity mismatch")
          for item in candidate["files"]:
              content = base64.b64decode(item["content_base64"], validate=True)
              if hashlib.sha256(content).hexdigest() != item["sha256"]:
                  raise SystemExit("file digest mismatch")
              paths.append(item["path"])
              if item["deleted"]:
                  tree.append({"path": item["path"], "mode": "100644", "type": "blob", "sha": None})
              else:
                  blob = api(f"repos/{repo}/git/blobs", "POST", {"content": item["content_base64"], "encoding": "base64"})
                  tree.append({"path": item["path"], "mode": item["mode"], "type": "blob", "sha": blob["sha"]})
          tree_obj = api(f"repos/{repo}/git/trees", "POST", {"base_tree": base_tree_sha, "tree": tree})
          candidate_tree_sha = tree_obj.get("sha") or ""
          if not re.fullmatch(r"[0-9a-f]{40}", candidate_tree_sha):
              raise SystemExit("candidate tree unavailable")
          commit_message = f"Claude: Issue #{os.environ['ISSUE_NUMBER']}"
          branch = os.environ["BRANCH"]
          created_ref = False
          try:
              current = api(f"repos/{repo}/git/ref/heads/{branch}")["object"]["sha"]
          except subprocess.CalledProcessError:
              current = ""
          if current:
              existing_commit = api(f"repos/{repo}/git/commits/{current}")
              parents = [parent.get("sha") for parent in (existing_commit.get("parents") or [])]
              if not (existing_commit.get("message") == commit_message and ((existing_commit.get("tree") or {}).get("sha") == candidate_tree_sha) and parents == [base_sha]):
                  raise SystemExit("generated branch already exists with another candidate")
              commit = {"sha": current}
          else:
              commit = api(f"repos/{repo}/git/commits", "POST", {"message": commit_message, "tree": candidate_tree_sha, "parents": [base_sha]})
              if not re.fullmatch(r"[0-9a-f]{40}", commit.get("sha") or ""):
                  raise SystemExit("candidate commit unavailable")
              revalidate_publication_source()
              api(f"repos/{repo}/git/refs", "POST", {"ref": f"refs/heads/{branch}", "sha": commit["sha"]})
              created_ref = True
          title = f"Claude: Issue #{os.environ['ISSUE_NUMBER']} exact-base recovery"
          body = f"Closes #{os.environ['ISSUE_NUMBER']}.\n\nSource existing PR: #{base_pr or 'none'}\nExact base SHA: `{base_sha}`\nExact candidate SHA: `{commit['sha']}`\n\n## Exact changed paths\n" + "\n".join(f"- `{path}`" for path in paths) + "\n\nCandidate bytes were validated read-only and published through the Git Data API; no candidate code executed with write credentials."
          created_pr = False
          restored_metadata = None
          number = None
          try:
              existing = api(f"repos/{repo}/pulls?state=open&head={repo.split('/')[0]}:{branch}")
              revalidate_publication_source()
              exact_matches = []
              for summary in existing:
                  candidate_number = summary.get("number")
                  if not isinstance(candidate_number, int):
                      raise SystemExit("existing PR number unavailable")
                  snapshot = api(f"repos/{repo}/pulls/{candidate_number}")
                  if exact_integration_pr(snapshot, branch, commit["sha"]):
                      exact_matches.append(snapshot)
              if existing:
                  if len(exact_matches) != 1:
                      raise SystemExit("existing PR identity mismatch")
                  result = exact_matches[0]
                  number = result["number"]
                  if result.get("title") != title or result.get("body") != body:
                      restored_metadata = {"title": result.get("title") or "", "body": result.get("body") or ""}
                      api(f"repos/{repo}/pulls/{number}", "PATCH", {"title": title, "body": body})
                      result = api(f"repos/{repo}/pulls/{number}")
              else:
                  result = api(f"repos/{repo}/pulls", "POST", {"title": title, "head": branch, "base": base_ref, "body": body, "draft": True})
                  created_pr = True
                  number = result.get("number")
                  if not isinstance(number, int):
                      raise SystemExit("created PR number unavailable")
                  result = api(f"repos/{repo}/pulls/{number}")
              revalidate_publication_source()
              if not exact_integration_pr(result, branch, commit["sha"]) or result.get("title") != title or result.get("body") != body:
                  raise SystemExit("published PR identity mismatch")
          except BaseException:
              if created_pr and isinstance(number, int):
                  api(f"repos/{repo}/pulls/{number}", "PATCH", {"state": "closed"})
              elif restored_metadata is not None and isinstance(number, int):
                  api(f"repos/{repo}/pulls/{number}", "PATCH", restored_metadata)
              if created_ref:
                  api(f"repos/{repo}/git/refs/heads/{branch}", "DELETE")
              raise
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"pr_url={result['html_url']}\nbranch_sha={commit['sha']}\n")
          PY

  finalize:
    needs: [prepare, implement, verify, publish]
    if: always() && needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}
      ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
      DUPLICATE_SKIPPED: ${{ needs.prepare.outputs.duplicate_skipped }}
      IMPLEMENT_RESULT: ${{ needs.implement.result }}
      VERIFY_RESULT: ${{ needs.verify.result }}
      PUBLISH_RESULT: ${{ needs.publish.outputs.branch_sha }}
      TARGET_SHA: ${{ needs.publish.outputs.branch_sha }}
    steps:
      - name: Publish successful Queue state or retain non-notifying failure evidence
        run: |
          set -euo pipefail
          gh label create ai-review --repo "$GITHUB_REPOSITORY" --color 0E8A16 --description "Automation candidate awaits exact-SHA evidence" --force
          if [ "$DUPLICATE_SKIPPED" = "true" ]; then
            exit 0
          fi
          if [ "$IMPLEMENT_RESULT" = success ] && [ "$VERIFY_RESULT" = success ] && [ "$PUBLISH_RESULT" = success ]; then
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label ai-review --remove-label ai-blocked || true
            exit 0
          fi
          {
            echo "## Queue pipeline incomplete"
            echo
            echo "- issue: #$ISSUE_NUMBER"
            echo "- immutable_sha: ${TARGET_SHA:-unavailable}"
            echo "- stages: implement=$IMPLEMENT_RESULT verify=$VERIFY_RESULT publish=$PUBLISH_RESULT"
            echo "- notification: false"
            echo "- next: merged default-branch reconciliation performs the bounded self-resolution audit and internal-stop decision"
          } >> "$GITHUB_STEP_SUMMARY"
