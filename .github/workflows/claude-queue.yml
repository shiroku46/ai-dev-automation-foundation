name: Claude Issue Queue
run-name: Optional Claude issue-${{ inputs.issue_number || github.event.issue.number || 'event' }}

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Trusted Issue number for an explicitly optional provider run
        required: true
        type: string

concurrency:
  group: optional-claude-${{ inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
      pull-requests: read
    outputs:
      issue_number: ${{ steps.guard.outputs.issue_number }}
      base_sha: ${{ steps.guard.outputs.base_sha }}
      contract_ok: ${{ steps.guard.outputs.contract_ok }}
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          DISPATCH_ISSUE: ${{ inputs.issue_number }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          CONFIGURED_OWNER: ${{ vars.AUTOMATION_OWNER }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          from scripts.queue_failure_classifier import check_tool_permission_contract

          event = json.loads(Path(os.environ["EVENT_PATH"]).read_text(encoding="utf-8"))
          owner = os.environ["CONFIGURED_OWNER"] or os.environ["OWNER"]
          actor = os.environ["ACTOR"]
          trigger = "/claude-run"
          issue_number = None
          allowed = actor.casefold() == owner.casefold()
          if os.environ["EVENT_NAME"] == "issue_comment":
              issue = event.get("issue") or {}
              body = (event.get("comment") or {}).get("body")
              allowed = allowed and not issue.get("pull_request") and body.strip() == trigger
              issue_number = issue.get("number")
          elif os.environ["EVENT_NAME"] == "workflow_dispatch":
              raw = os.environ.get("DISPATCH_ISSUE", "")
              allowed = allowed and raw.isdigit() and int(raw) > 0
              issue_number = int(raw) if raw.isdigit() else None
          else:
              allowed = False
          if not isinstance(issue_number, int) or issue_number <= 0:
              allowed = False
          issue = {}
          base_sha = ""
          contract_ok = False
          if allowed:
              issue = json.loads(subprocess.check_output(
                  ["gh", "api", f"repos/{os.environ['REPOSITORY']}/issues/{issue_number}"],
                  text=True,
              ))
              issue_author = ((issue.get("user") or {}).get("login") or "").casefold()
              allowed = issue.get("state") == "open" and not issue.get("pull_request") and issue_author == owner.casefold()
          if allowed:
              base_sha = json.loads(subprocess.check_output(
                  ["gh", "api", f"repos/{os.environ['REPOSITORY']}/commits/{os.environ['DEFAULT_BRANCH']}"],
                  text=True,
              ))["sha"]
              body = issue.get("body") or ""
              marker = re.search(
                  r"(?ms)<!--\s*foundation-provider-required-commands\s*\n(.*?)\n\s*-->",
                  body,
              )
              required_commands = [] if marker is None else [
                  line.strip() for line in marker.group(1).splitlines() if line.strip()
              ]
              denied = check_tool_permission_contract(required_commands, [])
              contract_ok = not denied
              if denied:
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                      summary.write("## Optional provider preflight\n\n")
                      summary.write("- result: `contract_failed`\n")
                      summary.write(f"- denied_command_count: `{len(denied)}`\n")
                      summary.write("- model_invocation: `skipped`\n")
                      summary.write("- notification: false\n")
                      summary.write("- human_action_required: false\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"issue_number={issue_number or ''}\n")
              output.write(f"base_sha={base_sha}\n")
              output.write(f"contract_ok={str(contract_ok).lower()}\n")
              output.write(f"should_run={str(allowed).lower()}\n")
          PY

  implement:
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true' && needs.prepare.outputs.contract_ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
      id-token: write
    outputs:
      artifact_sha256: ${{ steps.package.outputs.artifact_sha256 }}
      branch_name: ${{ steps.package.outputs.branch_name }}
      checkpoint_kind: ${{ steps.package.outputs.checkpoint_kind }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require immutable credential-free base
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git config --local remote.origin.pushurl disabled://optional-provider-publication-uses-api
      - id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@787c5a0ce96a9a6cfb050ea0c8f4c05f2447c251
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: ${{ github.event.repository.default_branch }}
          branch_prefix: claude-issue-${{ needs.prepare.outputs.issue_number }}-
          track_progress: false
          prompt: |
            Implement Issue #${{ needs.prepare.outputs.issue_number }} exactly as written from immutable base ${{ needs.prepare.outputs.base_sha }}.
            Read AGENTS.md, CLAUDE.md, SECURITY.md, docs/PROJECT_STARTUP.md, and docs/OPERATING_RULES.md.
            Change only authorized paths. Do not push, merge, deploy, access another repository,
            reveal Secrets, execute repository code, or change repository settings.

            Turn budget: reserve the final 5 turns for path audit and durable worktree checkpoint packaging.
            Save the worktree after each major file or logical work unit. At the reserve threshold,
            stop editing and leave the best authorized checkpoint. The fixed verification and Git Data
            publication jobs handle publication after validation.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep"
      - id: package
        name: Package authorized complete or WIP checkpoint bytes
        if: always() && steps.claude.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib, re, stat, subprocess

          base = os.environ["BASE_SHA"]
          if subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() != base:
              raise SystemExit("provider changed HEAD")
          issue = json.loads(subprocess.check_output(
              ["gh", "api", f"repos/{os.environ['REPOSITORY']}/issues/{os.environ['ISSUE_NUMBER']}"],
              text=True,
          ))
          body = issue.get("body") or ""
          match = re.search(r"(?ms)^## (?:Exact )?Allowed paths\s*\n(.*?)(?=^## |\Z)", body)
          rules = [] if match is None else [
              line.strip()[2:].strip().strip("`")
              for line in match.group(1).splitlines()
              if line.strip().startswith("- ")
          ]
          if not rules:
              raise SystemExit("authorized paths unavailable")
          def allowed(path):
              return any(
                  path == rule or (
                      rule.endswith("/**") and
                      (path == rule[:-3].rstrip("/") or path.startswith(rule[:-3].rstrip("/") + "/"))
                  )
                  for rule in rules
              )
          names = subprocess.check_output(
              ["git", "diff", "--name-only", "--no-renames", "-z", base, "--"]
          names += subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard", "-z"])
          paths = sorted({item.decode("utf-8") for item in names.split(b"\0") if item})
          if not paths or any(not allowed(path) for path in paths):
              raise SystemExit("empty or unauthorized checkpoint")
          files = []
          for path in paths:
              pure = pathlib.PurePosixPath(path)
              if pure.is_absolute() or ".." in pure.parts:
                  raise SystemExit("unsafe path")
              disk = pathlib.Path(path)
              if disk.is_symlink():
                  raise SystemExit("checkpoint symlink is prohibited")
              if disk.exists():
                  info = disk.stat(follow_symlinks=False)
                  if not stat.S_ISREG(info.st_mode):
                      raise SystemExit("checkpoint leaves must be regular files")
                  content = disk.read_bytes()
                  mode = "100755" if info.st_mode & stat.S_IXUSR else "100644"
                  deleted = False
              else:
                  content = b""
                  mode = None
                  deleted = True
              files.append({
                  "path": path,
                  "mode": mode,
                  "deleted": deleted,
                  "sha256": hashlib.sha256(content).hexdigest(),
                  "content_base64": base64.b64encode(content).decode("ascii"),
              })
          kind = "complete" if os.environ["CLAUDE_OUTCOME"] == "success" else "wip"
          branch = f"claude-issue-{os.environ['ISSUE_NUMBER']}-run-{os.environ['RUN_ID']}"
          payload = {
              "version": 1,
              "base_sha": base,
              "branch_name": branch,
              "checkpoint_kind": kind,
              "retry_identity": f"run-{os.environ['RUN_ID']}-attempt-{os.environ['RUN_ATTEMPT']}",
              "changed_paths": paths,
              "files": files,
          }
          raw = json.dumps(payload, sort_keys=True, separators=(",", ":")).encode("utf-8")
          digest = hashlib.sha256(raw).hexdigest()
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "queue-candidate"
          target.mkdir()
          (target / "candidate.json").write_bytes(raw)
          (target / "candidate.sha256").write_text(digest + "  candidate.json\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"artifact_sha256={digest}\n")
              output.write(f"branch_name={branch}\n")
              output.write(f"checkpoint_kind={kind}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Optional provider checkpoint\n\n")
              summary.write(f"- checkpoint_kind: `{kind}`\n")
              summary.write(f"- base_sha: `{base}`\n")
              summary.write(f"- diff_hash: `{digest}`\n")
              summary.write(f"- changed_path_count: `{len(paths)}`\n")
              summary.write("- notification: false\n")
              summary.write("- human_action_required: false\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.package.outcome == 'success'
        with:
          name: queue-${{ steps.package.outputs.checkpoint_kind }}-${{ github.run_id }}
          path: ${{ runner.temp }}/queue-candidate
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: [prepare, implement]
    if: needs.implement.outputs.checkpoint_kind == 'complete'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: queue-complete-${{ github.run_id }}
          path: ${{ runner.temp }}/queue-candidate
      - name: Verify artifact digest and materialize candidate
        env:
          EXPECTED_DIGEST: ${{ needs.implement.outputs.artifact_sha256 }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "queue-candidate"
          raw = (root / "candidate.json").read_bytes()
          if hashlib.sha256(raw).hexdigest() != os.environ["EXPECTED_DIGEST"]:
              raise SystemExit("artifact digest mismatch")
          data = json.loads(raw)
          if data.get("base_sha") != os.environ["BASE_SHA"]:
              raise SystemExit("artifact base mismatch")
          for item in data.get("files", []):
              path = pathlib.Path(item["path"])
              content = base64.b64decode(item["content_base64"], validate=True)
              if hashlib.sha256(content).hexdigest() != item["sha256"]:
                  raise SystemExit("file digest mismatch")
              if item["deleted"]:
                  if path.exists() or path.is_symlink():
                      path.unlink()
              else:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(content)
                  path.chmod(0o755 if item["mode"] == "100755" else 0o644)
          PY
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - run: python scripts/public_export_guard.py .
      - run: python scripts/validate_repository.py
      - run: |
          if [ -d tests ]; then
            python -m unittest discover -s tests
          fi

  publish:
    needs: [prepare, implement, verify]
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    outputs:
      branch_sha: ${{ steps.publish.outputs.branch_sha }}
      pr_url: ${{ steps.publish.outputs.pr_url }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: queue-complete-${{ github.run_id }}
          path: ${{ runner.temp }}/queue-candidate
      - id: publish
        name: Publish verified Git objects without candidate execution
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          BRANCH: ${{ needs.implement.outputs.branch_name }}
          EXPECTED_DIGEST: ${{ needs.implement.outputs.artifact_sha256 }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, subprocess, hashlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "queue-candidate"
          raw = (root / "candidate.json").read_bytes()
          if hashlib.sha256(raw).hexdigest() != os.environ["EXPECTED_DIGEST"]:
              raise SystemExit("artifact digest mismatch")
          data = json.loads(raw)
          if data.get("base_sha") != os.environ["BASE_SHA"] or data.get("branch_name") != os.environ["BRANCH"]:
              raise SystemExit("artifact identity mismatch")
          repo = os.environ["REPOSITORY"]
          def api(path, method="GET", payload=None):
              command = ["gh", "api", "--method", method, path]
              if payload is not None:
                  command += ["--input", "-"]
              result = subprocess.run(
                  command,
                  input=None if payload is None else json.dumps(payload),
                  text=True,
                  stdout=subprocess.PIPE,
                  check=True,
              )
              return json.loads(result.stdout or "null")
          base = api(f"repos/{repo}/git/commits/{os.environ['BASE_SHA']}")
          tree = []
          for item in data["files"]:
              if item["deleted"]:
                  tree.append({"path": item["path"], "mode": "100644", "type": "blob", "sha": None})
              else:
                  blob = api(f"repos/{repo}/git/blobs", "POST", {
                      "content": item["content_base64"], "encoding": "base64"
                  })
                  tree.append({
                      "path": item["path"], "mode": item["mode"], "type": "blob", "sha": blob["sha"]
                  })
          tree_obj = api(f"repos/{repo}/git/trees", "POST", {
              "base_tree": base["tree"]["sha"], "tree": tree
          })
          commit = api(f"repos/{repo}/git/commits", "POST", {
              "message": f"Optional Claude: Issue #{os.environ['ISSUE_NUMBER']}",
              "tree": tree_obj["sha"],
              "parents": [os.environ["BASE_SHA"]],
          })
          branch = os.environ["BRANCH"]
          api(f"repos/{repo}/git/refs", "POST", {
              "ref": f"refs/heads/{branch}", "sha": commit["sha"]
          })
          title = f"Optional Claude: Issue #{os.environ['ISSUE_NUMBER']}"
          body = (
              f"Closes #{os.environ['ISSUE_NUMBER']}.\n\n"
              f"Exact base SHA: `{os.environ['BASE_SHA']}`\n"
              f"Exact candidate SHA: `{commit['sha']}`\n\n"
              "Candidate bytes were validated in a read-only job and published through Git Data API."
          )
          created = api(f"repos/{repo}/pulls", "POST", {
              "title": title,
              "head": branch,
              "base": api(f"repos/{repo}")["default_branch"],
              "body": body,
              "draft": True,
          })
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"branch_sha={commit['sha']}\n")
              output.write(f"pr_url={created['html_url']}\n")
          PY

  finalize:
    needs: [prepare, implement, verify, publish]
    if: always() && needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Record public-safe optional route state
        env:
          CONTRACT_OK: ${{ needs.prepare.outputs.contract_ok }}
          IMPLEMENT_RESULT: ${{ needs.implement.result }}
          CHECKPOINT_KIND: ${{ needs.implement.outputs.checkpoint_kind }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
          PR_URL: ${{ needs.publish.outputs.pr_url }}
        run: |
          {
            echo "## Optional Claude route"
            echo
            echo "- contract_ok: \`${CONTRACT_OK:-false}\`"
            echo "- implementation_result: \`${IMPLEMENT_RESULT:-skipped}\`"
            echo "- checkpoint_kind: \`${CHECKPOINT_KIND:-none}\`"
            echo "- verify_result: \`${VERIFY_RESULT:-skipped}\`"
            echo "- publish_result: \`${PUBLISH_RESULT:-skipped}\`"
            echo "- candidate_pr: \`${PR_URL:-none}\`"
            echo "- notification: false"
            echo "- human_action_required: false"
            echo "- next_action: Continue GitHub-direct work when this optional route is unavailable."
          } >> "$GITHUB_STEP_SUMMARY"
