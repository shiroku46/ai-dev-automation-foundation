name: Claude Issue Queue

on:
  issues:
    types: [opened]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Trusted Issue number
        required: true
        type: string
      trusted_supervisor:
        description: True only for a default-branch supervisor dispatch
        required: false
        default: false
        type: boolean
      trusted_run_id:
        description: Supervisor workflow run ID when dispatched by github-actions[bot]
        required: false
        default: ""
        type: string

concurrency:
  group: claude-issue-${{ inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    if: |
      (
        (github.event_name == 'issues' || github.event_name == 'issue_comment') &&
        (
          github.actor == github.repository_owner ||
          (vars.AUTOMATION_OWNER != '' && github.actor == vars.AUTOMATION_OWNER)
        )
      ) ||
      (
        github.event_name == 'workflow_dispatch' &&
        github.ref_name == github.event.repository.default_branch &&
        (
          github.actor == github.repository_owner ||
          (vars.AUTOMATION_OWNER != '' && github.actor == vars.AUTOMATION_OWNER) ||
          github.actor == 'github-actions[bot]'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: read
    outputs:
      issue_number: ${{ steps.guard.outputs.issue_number }}
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          DISPATCH_ISSUE: ${{ inputs.issue_number }}
          TRUSTED_SUPERVISOR: ${{ inputs.trusted_supervisor }}
          TRUSTED_RUN_ID: ${{ inputs.trusted_run_id }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          CONFIGURED_OWNER: ${{ vars.AUTOMATION_OWNER }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          import subprocess
          from pathlib import Path

          event_name = os.environ["EVENT_NAME"]
          event = json.loads(Path(os.environ["EVENT_PATH"]).read_text())
          actor = os.environ["ACTOR"]
          owner = os.environ["OWNER"]
          configured_owner = os.environ.get("CONFIGURED_OWNER", "")
          repository = os.environ["REPOSITORY"]
          default_branch = os.environ["DEFAULT_BRANCH"]
          trigger = "/claude-run"
          issue_number = ""
          allowed = False

          def api(path: str):
              return json.loads(
                  subprocess.check_output(
                      ["gh", "api", "-H", "Accept: application/vnd.github+json", path],
                      text=True,
                  )
              )

          if event_name == "issue_comment":
              issue = event.get("issue") or {}
              body = ((event.get("comment") or {}).get("body") or "")
              issue_number = str(issue.get("number") or "")
              allowed = not issue.get("pull_request") and body.strip() == trigger
          elif event_name == "issues":
              issue = event.get("issue") or {}
              issue_number = str(issue.get("number") or "")
              body = issue.get("body") or ""
              lines = [
                  line.strip()
                  for line in re.sub(r"<!--.*?-->", "", body, flags=re.S).splitlines()
                  if line.strip()
              ]
              allowed = bool(lines and lines[0] == trigger)
          elif event_name == "workflow_dispatch":
              issue_number = os.environ.get("DISPATCH_ISSUE", "")
              owner_dispatch = actor == owner or bool(configured_owner and actor == configured_owner)
              if owner_dispatch:
                  allowed = issue_number.isdigit()
              elif actor == "github-actions[bot]":
                  run_id = os.environ.get("TRUSTED_RUN_ID", "")
                  trusted = os.environ.get("TRUSTED_SUPERVISOR", "").lower() == "true"
                  if trusted and issue_number.isdigit() and run_id.isdigit():
                      snapshot = api(f"repos/{repository}/actions/runs/{run_id}")
                      default_sha = api(f"repos/{repository}/commits/{default_branch}")["sha"]
                      expected_path = f".github/workflows/supervisor.yml@{default_branch}"
                      allowed = (
                          (snapshot.get("repository") or {}).get("full_name") == repository
                          and snapshot.get("path") == expected_path
                          and snapshot.get("head_branch") == default_branch
                          and snapshot.get("head_sha") == default_sha
                          and snapshot.get("status") in {"queued", "in_progress"}
                          and snapshot.get("event") in {"workflow_run", "schedule", "workflow_dispatch"}
                      )

          if issue_number.isdigit() and allowed:
              issue_snapshot = api(f"repos/{repository}/issues/{issue_number}")
              issue_author = (issue_snapshot.get("user") or {}).get("login") or ""
              trusted_authors = {owner}
              if configured_owner:
                  trusted_authors.add(configured_owner)
              allowed = (
                  not issue_snapshot.get("pull_request")
                  and issue_author in trusted_authors
              )
          else:
              allowed = False

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"issue_number={issue_number}\n")
              output.write(f"should_run={str(allowed).lower()}\n")
          PY

  implement:
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: write
      pull-requests: write
      issues: write
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - id: claude
        uses: anthropics/claude-code-action@787c5a0ce96a9a6cfb050ea0c8f4c05f2447c251
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: ${{ github.event.repository.default_branch }}
          branch_prefix: claude-issue-${{ needs.prepare.outputs.issue_number }}-
          track_progress: true
          prompt: |
            Implement Issue #${{ needs.prepare.outputs.issue_number }} exactly as written.
            Read AGENTS.md, CLAUDE.md, SECURITY.md, and docs/OPERATING_RULES.md.
            Change only authorized paths. Do not execute repository code, merge, deploy,
            access another repository, reveal Secrets, or change repository settings.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep"
      - name: Require generated branch
        env:
          BRANCH: ${{ steps.claude.outputs.branch_name }}
        run: test -n "$BRANCH"
