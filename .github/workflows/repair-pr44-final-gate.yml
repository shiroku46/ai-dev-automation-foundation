name: Repair PR 44 Final Merge Gate

on:
  push:
    branches: [main]
  schedule:
    - cron: "29 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: repair-pr-44-final-merge-gate
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    env:
      TARGET_PR: "44"
      TARGET_BRANCH: fix/issue-36-human-notice-contract
      EXPECTED_HEAD: 3be4d1f551116b30e937543384372649d3b7250d
    steps:
      - name: Apply exact final-gate source and regression repairs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' ' ' | base64 --decode | gzip --decompress | python3
