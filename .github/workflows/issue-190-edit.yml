name: Issue 190 exact patch

on:
  push:
    branches:
      - github/issue-190-trusted-issue-control

permissions:
  contents: write

concurrency:
  group: issue-190-exact-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: github/issue-190-trusted-issue-control
          fetch-depth: 0
      - name: Apply exact branch patch
        run: python3 scripts/issue_190_patch.py
      - name: Validate exact persistent diff
        run: |
          git diff --check
          test "$(git diff --name-only | sort)" = $'.github/workflows/ci-reconcile.yml\n.github/workflows/issue-190-edit.yml\nscripts/issue_190_patch.py\ntests/test_workflow_security.py'
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap
          text = Path('.github/workflows/ci-reconcile.yml').read_text(encoding='utf-8')
          match = re.search(r"(?ms)^          python3 - <<'PY'\n(?P<body>.*?)^          PY$", text)
          if match is None:
              raise SystemExit('embedded Python missing')
          compile(textwrap.dedent(match.group('body')), 'ci-reconcile-embedded', 'exec')
          PY
          python3 -m unittest tests.test_workflow_security
      - name: Commit self-removing patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/ci-reconcile.yml tests/test_workflow_security.py .github/workflows/issue-190-edit.yml scripts/issue_190_patch.py
          git commit -m 'Normalize trusted Queue Issue identity'
          git push origin HEAD:github/issue-190-trusted-issue-control
