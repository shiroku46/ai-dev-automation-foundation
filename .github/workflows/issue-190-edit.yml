name: Issue 190 exact patch

on:
  push:
    branches:
      - github/issue-190-trusted-issue-control

permissions:
  contents: write

concurrency:
  group: issue-190-exact-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: github/issue-190-trusted-issue-control
          fetch-depth: 0
      - name: Generate exact workflow blob and test patch
        run: python3 scripts/issue_190_patch.py
      - name: Validate generated workflow and focused tests
        run: |
          git diff --check
          changed_paths() { { git diff --name-only; git ls-files --others --exclude-standard; } | sort; }
          test "$(changed_paths)" = $'automation-tmp/issue-190-ci-reconcile.yml\ntests/test_workflow_security.py'
          python3 - <<'PY'
          from pathlib import Path
          import re
          import textwrap
          generated = Path('automation-tmp/issue-190-ci-reconcile.yml')
          text = generated.read_text(encoding='utf-8')
          match = re.search(r"(?ms)^          python3 - <<'PY'\n(?P<body>.*?)^          PY$", text)
          if match is None:
              raise SystemExit('embedded Python missing')
          compile(textwrap.dedent(match.group('body')), 'ci-reconcile-embedded', 'exec')
          target = Path('.github/workflows/ci-reconcile.yml')
          original = target.read_bytes()
          target.write_bytes(generated.read_bytes())
          try:
              import subprocess
              subprocess.run(['python3', '-m', 'unittest', 'tests.test_workflow_security'], check=True)
          finally:
              target.write_bytes(original)
          PY
          test "$(changed_paths)" = $'automation-tmp/issue-190-ci-reconcile.yml\ntests/test_workflow_security.py'
      - name: Push non-workflow handoff only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add automation-tmp/issue-190-ci-reconcile.yml tests/test_workflow_security.py
          git commit -m 'Stage trusted Queue Issue identity patch'
          git push origin HEAD:github/issue-190-trusted-issue-control
