name: Repair PR 44 Final Mutation Races

on:
  push:
    branches: [main]
  schedule:
    - cron: "59 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: repair-pr-44-final-mutation-races
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      issues: read
      pull-requests: read
    env:
      TARGET_PR: "44"
      TARGET_BRANCH: fix/issue-36-human-notice-contract
      EXPECTED_HEAD: d8e588e0ffa52a524918ead4aed3b0de4753c22d
      TARGET_PATH: scripts/supervisor_runtime.py
      SOURCE_ISSUE: "36"
    steps:
      - name: Apply fixed exact-head final-gate repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import json
          import os
          import re
          import subprocess

          repository = os.environ["GITHUB_REPOSITORY"]
          target_pr = int(os.environ["TARGET_PR"])
          target_branch = os.environ["TARGET_BRANCH"]
          expected_head = os.environ["EXPECTED_HEAD"]
          target_path = os.environ["TARGET_PATH"]
          source_issue = int(os.environ["SOURCE_ISSUE"])
          owner = repository.split("/", 1)[0]

          def gh(*args: str) -> str:
              return subprocess.run(
                  ["gh", *args],
                  check=True,
                  capture_output=True,
                  text=True,
              ).stdout

          def api(path: str):
              return json.loads(
                  gh("api", "-H", "Accept: application/vnd.github+json", path)
              )

          def authorized_paths(body: str) -> set[str]:
              marker = "<!-- foundation-protected-authorization"
              if marker not in body:
                  return set()
              remainder = body.split(marker, 1)[1]
              if "-->" not in remainder:
                  return set()
              block = remainder.split("-->", 1)[0]
              paths: set[str] = set()
              in_paths = False
              for raw in block.splitlines():
                  line = raw.strip()
                  if line == "paths:":
                      in_paths = True
                      continue
                  if in_paths and line.startswith("- "):
                      paths.add(line[2:].strip("` "))
                  elif in_paths and line and not line.startswith("#"):
                      in_paths = False
              return paths

          def target_snapshot():
              snapshot = api(f"repos/{repository}/pulls/{target_pr}")
              head = snapshot.get("head") or {}
              base = snapshot.get("base") or {}
              if snapshot.get("state") != "open":
                  raise RuntimeError("Target Pull Request is not open")
              if ((head.get("repo") or {}).get("full_name")) != repository:
                  raise RuntimeError("Target Pull Request head is not same-repository")
              if ((base.get("repo") or {}).get("full_name")) != repository:
                  raise RuntimeError("Target Pull Request base is not same-repository")
              if base.get("ref") != "main":
                  raise RuntimeError("Target Pull Request base branch changed")
              if head.get("ref") != target_branch:
                  raise RuntimeError("Target Pull Request branch changed")
              if head.get("sha") != expected_head:
                  print("Target head moved; exact repair is no longer applicable.")
                  raise SystemExit(0)
              source_link = re.compile(
                  rf"(?im)^\s*(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s+#{source_issue}\.?\s*$"
              )
              if source_link.search(snapshot.get("body") or "") is None:
                  raise RuntimeError("Target Pull Request source Issue linkage changed")
              issue = api(f"repos/{repository}/issues/{source_issue}")
              if issue.get("pull_request"):
                  raise RuntimeError("Fixed source is not an Issue")
              if (issue.get("user") or {}).get("login") != owner:
                  raise RuntimeError("Fixed source Issue is not owner-authored")
              if target_path not in authorized_paths(issue.get("body") or ""):
                  raise RuntimeError("Fixed source authorization no longer permits target path")
              return snapshot

          target_snapshot()
          metadata = api(
              f"repos/{repository}/contents/{target_path}?ref={expected_head}"
          )
          if metadata.get("type") != "file" or metadata.get("encoding") != "base64":
              raise RuntimeError("Target runtime is not one base64 file")
          original_blob = str(metadata.get("sha") or "")
          original = base64.b64decode(
              str(metadata.get("content") or "").replace("\n", "")
          ).decode("utf-8")

          old = '''        final_native_clean, _ = native_workflow_evidence(sha, pr_number)
                  if not final_native_clean or not exact_codex_clean(pr_number, sha):
                      continue
          
                  scope_candidate = _live_pr(pr_number, sha)
                  final_issue_number, _, _, final_scope_error = source_and_scope(scope_candidate)
          '''
          new = '''        final_native_clean, _ = native_workflow_evidence(sha, pr_number)
                  if not final_native_clean or not exact_codex_clean(pr_number, sha):
                      continue
                  if not exact_codex_clean(pr_number, sha):
                      continue
          
                  scope_candidate = _live_pr(pr_number, sha)
                  if scope_candidate.get("mergeable") is not True or not trusted_candidate(
                      scope_candidate
                  ):
                      continue
                  final_issue_number, _, _, final_scope_error = source_and_scope(scope_candidate)
          '''
          if original.count(old) != 1:
              raise RuntimeError("Final merge-gate repair anchor count is not exactly one")
          updated = original.replace(old, new, 1)
          compile(updated, target_path, "exec")
          supervise_tail = updated.split("def supervise() -> None:", 1)[1]
          last_codex = supervise_tail.rfind("exact_codex_clean(pr_number, sha)")
          last_scope = supervise_tail.rfind("source_and_scope(scope_candidate)")
          final_live = supervise_tail.rfind("merge_candidate = _live_pr(pr_number, sha)")
          if not (0 <= last_codex < last_scope < final_live):
              raise RuntimeError("Final Codex/scope/live ordering regression")

          target_snapshot()
          current = api(
              f"repos/{repository}/contents/{target_path}?ref={target_branch}"
          )
          if current.get("sha") != original_blob:
              raise RuntimeError("Target runtime blob moved before update")
          current_text = base64.b64decode(
              str(current.get("content") or "").replace("\n", "")
          ).decode("utf-8")
          if current_text != original:
              raise RuntimeError("Target runtime bytes moved before update")

          encoded = base64.b64encode(updated.encode("utf-8")).decode("ascii")
          result = json.loads(
              gh(
                  "api",
                  "--method",
                  "PUT",
                  f"repos/{repository}/contents/{target_path}",
                  "-f",
                  "message=Repair final exact-head merge gate ordering",
                  "-f",
                  f"content={encoded}",
                  "-f",
                  f"sha={original_blob}",
                  "-f",
                  f"branch={target_branch}",
              )
          )
          commit_sha = str((result.get("commit") or {}).get("sha") or "")
          if not re.fullmatch(r"[0-9a-f]{40}", commit_sha):
              raise RuntimeError("Contents update returned no immutable commit SHA")
          final = api(f"repos/{repository}/pulls/{target_pr}")
          if ((final.get("head") or {}).get("sha")) != commit_sha:
              raise RuntimeError("Target Pull Request did not advance to repair commit")
          if ((final.get("head") or {}).get("ref")) != target_branch:
              raise RuntimeError("Target Pull Request branch changed after update")
          print(f"Repaired PR #{target_pr} at {commit_sha}")
          PY
