name: Issue 205 implementation runner

on:
  push:
    branches: [github/issue-205-maintainability]
    paths:
      - .github/issue-205-implement.py
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  implement:
    if: >-
      (github.event_name == 'push' && github.event.head_commit.message == 'Run Issue 205 implementation') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'github/issue-205-maintainability')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: github/issue-205-maintainability
          fetch-depth: 0
      - name: Correct the temporary implementation assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/issue-205-implement.py')
          content = path.read_text(encoding='utf-8')
          replacements = (
              ('    "scripts/validate_repository.py",\n):\n    content = read(relative)\n', '):\n    content = read(relative)\n'),
              ('    for forbidden in ("EVENT_PATH", "github.event_path", "Path(os.environ"):\n', '    for forbidden in ("EVENT_PATH", "github.event_path"):\n'),
          )
          for old, new in replacements:
              if content.count(old) != 1:
                  raise SystemExit(f'temporary implementation pattern changed: {old!r}')
              content = content.replace(old, new, 1)
          path.write_text(content, encoding='utf-8')
          PY
      - name: Apply authorized maintenance changes
        run: python .github/issue-205-implement.py
      - name: Correct active guard test fixtures
        run: |
          python - <<'PY'
          from pathlib import Path
          guard = Path('tests/test_queue_event_guard.py')
          content = guard.read_text(encoding='utf-8')
          old = '                decision = self.decision(\n                    event_name="issue_comment",\n                    dispatch_issue="",\n                    comment_issue="173",\n                    comment_body="/claude-run",\n                    **override,\n                )\n'
          new = '                values = {\n                    "event_name": "issue_comment",\n                    "dispatch_issue": "",\n                    "comment_issue": "173",\n                    "comment_body": "/claude-run",\n                }\n                values.update(override)\n                decision = self.decision(**values)\n'
          if content.count(old) != 1:
              raise SystemExit('Queue guard fixture pattern changed')
          guard.write_text(content.replace(old, new, 1), encoding='utf-8')
          security = Path('tests/test_workflow_security.py')
          content = security.read_text(encoding='utf-8')
          old = '        self.assertIn("body.strip() == trigger", queue)\n'
          new = '        self.assertIn("from scripts.queue_event_guard import resolve_queue_event", queue)\n        self.assertNotIn("github.event_path", queue)\n        self.assertNotIn("EVENT_PATH", queue)\n'
          if content.count(old) != 1:
              raise SystemExit('Workflow security guard assertion pattern changed')
          security.write_text(content.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove temporary transports
        run: |
          rm -f .github/workflows/issue-205-reference-audit.yml
          rm -f .github/workflows/issue-205-implement.yml
          rm -f .github/issue-205-implement.py
      - name: Validate repository
        run: |
          python -m compileall -q scripts bootstrap tests
          python scripts/public_export_guard.py .
          python scripts/validate_repository.py
          python -m unittest discover -s tests
          git diff --check
      - name: Publish exact branch candidate
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Extract Queue admission and retire legacy recovery runtimes"
          git push origin HEAD:github/issue-205-maintainability
