name: Issue 205 implementation runner

on:
  push:
    branches: [github/issue-205-maintainability]
    paths:
      - .github/issue-205-implement.py
      - .github/workflows/issue-205-implement.yml
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  implement:
    if: >-
      (github.event_name == 'push') ||
      (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'github/issue-205-maintainability')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: github/issue-205-maintainability
          fetch-depth: 0
          persist-credentials: false
      - name: Correct the temporary implementation assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/issue-205-implement.py')
          content = path.read_text(encoding='utf-8')
          replacements = (
              ('    "scripts/validate_repository.py",\n):\n    content = read(relative)\n', '):\n    content = read(relative)\n'),
              ('    for forbidden in ("EVENT_PATH", "github.event_path", "Path(os.environ"):\n', '    for forbidden in ("EVENT_PATH", "github.event_path"):\n'),
          )
          for old, new in replacements:
              if content.count(old) != 1:
                  raise SystemExit(f'temporary implementation pattern changed: {old!r}')
              content = content.replace(old, new, 1)
          path.write_text(content, encoding='utf-8')
          PY
      - name: Apply authorized maintenance changes
        run: python .github/issue-205-implement.py
      - name: Correct active guard test fixtures
        run: |
          python - <<'PY'
          from pathlib import Path
          guard = Path('tests/test_queue_event_guard.py')
          content = guard.read_text(encoding='utf-8')
          old = '                decision = self.decision(\n                    event_name="issue_comment",\n                    dispatch_issue="",\n                    comment_issue="173",\n                    comment_body="/claude-run",\n                    **override,\n                )\n'
          new = '                values = {\n                    "event_name": "issue_comment",\n                    "dispatch_issue": "",\n                    "comment_issue": "173",\n                    "comment_body": "/claude-run",\n                }\n                values.update(override)\n                decision = self.decision(**values)\n'
          if content.count(old) != 1:
              raise SystemExit('Queue guard fixture pattern changed')
          guard.write_text(content.replace(old, new, 1), encoding='utf-8')
          security = Path('tests/test_workflow_security.py')
          content = security.read_text(encoding='utf-8')
          old = '        self.assertIn("body.strip() == trigger", queue)\n'
          new = '        self.assertIn("from scripts.queue_event_guard import resolve_queue_event", queue)\n        self.assertNotIn("github.event_path", queue)\n        self.assertNotIn("EVENT_PATH", queue)\n'
          if content.count(old) != 1:
              raise SystemExit('Workflow security guard assertion pattern changed')
          security.write_text(content.replace(old, new, 1), encoding='utf-8')
          rules = Path('docs/OPERATING_RULES.md')
          rules.write_text(rules.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY
      - name: Remove temporary transports and generated caches
        run: |
          rm -f .github/workflows/issue-205-reference-audit.yml
          rm -f .github/workflows/issue-205-implement.yml
          rm -f .github/issue-205-implement.py
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
      - name: Validate repository
        run: |
          python scripts/public_export_guard.py .
          python scripts/validate_repository.py
          python -m unittest discover -s tests
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git diff --check
      - name: Build immutable candidate bundle
        env:
          BUNDLE_ROOT: ${{ runner.temp }}/issue-205-candidate
        run: |
          python - <<'PY'
          import json
          import os
          import shutil
          import stat
          import subprocess
          from pathlib import Path

          root = Path.cwd()
          bundle = Path(os.environ['BUNDLE_ROOT'])
          files_root = bundle / 'files'
          files_root.mkdir(parents=True, exist_ok=True)
          base_sha = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          rows = subprocess.check_output(
              ['git', 'diff', '--name-status', '--no-renames', 'HEAD'], text=True
          ).splitlines()
          entries = []
          for row in rows:
              status_code, relative = row.split('\t', 1)
              status_code = status_code[0]
              source = root / relative
              if status_code == 'D':
                  entries.append({'path': relative, 'status': 'deleted', 'mode': None})
                  continue
              if not source.is_file():
                  raise SystemExit(f'candidate path is not a regular file: {relative}')
              target = files_root / relative
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copy2(source, target)
              executable = bool(source.stat().st_mode & stat.S_IXUSR)
              entries.append({
                  'path': relative,
                  'status': 'upsert',
                  'mode': '100755' if executable else '100644',
              })
          if not entries:
              raise SystemExit('candidate bundle is empty')
          manifest = {
              'schema': 'issue-205-candidate-v1',
              'base_sha': base_sha,
              'entries': entries,
          }
          (bundle / 'manifest.json').write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(manifest, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: issue-205-validated-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/issue-205-candidate
          if-no-files-found: error
          retention-days: 1
