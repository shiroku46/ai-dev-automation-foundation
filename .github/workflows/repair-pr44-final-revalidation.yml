name: Repair PR 44 Final Revalidation

on:
  push:
    branches: [main]
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: repair-pr-44-final-revalidation
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Apply exact final stop and merge revalidation repair
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_PR: "44"
          TARGET_BRANCH: fix/issue-36-human-notice-contract
          EXPECTED_HEAD: b5df12e4368131b3be2ec82977bb703b459157b4
          RUNTIME_PATH: scripts/supervisor_runtime.py
          TEST_PATH: tests/test_runtime_scope_and_checks.py
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess

          repository = os.environ["GITHUB_REPOSITORY"]
          pr_number = int(os.environ["TARGET_PR"])
          target_branch = os.environ["TARGET_BRANCH"]
          expected_head = os.environ["EXPECTED_HEAD"]
          runtime_path = os.environ["RUNTIME_PATH"]
          test_path = os.environ["TEST_PATH"]
          target_paths = (runtime_path, test_path)

          def gh(*args, input_value=None):
              result = subprocess.run(
                  ["gh", *args],
                  input=input_value,
                  text=True,
                  capture_output=True,
                  check=False,
              )
              if result.returncode != 0:
                  raise RuntimeError(
                      "gh command failed: " + " ".join(args) + "\n" + result.stderr.strip()
                  )
              return result.stdout

          def api(path):
              return json.loads(
                  gh("api", "-H", "Accept: application/vnd.github+json", path)
              )

          def api_json(method, path, payload):
              return json.loads(
                  gh(
                      "api",
                      "--method",
                      method,
                      "-H",
                      "Accept: application/vnd.github+json",
                      "--input",
                      "-",
                      path,
                      input_value=json.dumps(payload),
                  )
              )

          def require_target(snapshot):
              head = snapshot.get("head") or {}
              base = snapshot.get("base") or {}
              if snapshot.get("state") != "open":
                  print("Target Pull Request is no longer open; nothing to repair.")
                  raise SystemExit(0)
              if (head.get("repo") or {}).get("full_name") != repository:
                  raise RuntimeError("Target head is not same-repository")
              if (base.get("repo") or {}).get("full_name") != repository:
                  raise RuntimeError("Target base is not same-repository")
              if head.get("ref") != target_branch:
                  raise RuntimeError("Target branch changed")
              if head.get("sha") != expected_head:
                  print("Target head already moved; exact repair is no longer applicable.")
                  raise SystemExit(0)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one exact replacement target, found {count}")
              return text.replace(old, new, 1)

          require_target(api(f"repos/{repository}/pulls/{pr_number}"))
          commit = api(f"repos/{repository}/git/commits/{expected_head}")
          tree_sha = (commit.get("tree") or {}).get("sha")
          if not tree_sha:
              raise RuntimeError("Expected commit has no tree")
          tree = api(f"repos/{repository}/git/trees/{tree_sha}?recursive=1")
          by_path = {
              item.get("path"): item
              for item in tree.get("tree") or []
              if item.get("path") in target_paths
          }
          if set(by_path) != set(target_paths):
              raise RuntimeError("Expected tree does not contain the exact two target paths")

          contents = {}
          for path in target_paths:
              entry = by_path[path]
              if entry.get("type") != "blob" or entry.get("mode") not in {"100644", "100755"}:
                  raise RuntimeError(f"Unexpected target type or mode for {path}")
              payload = api(f"repos/{repository}/contents/{path}?ref={expected_head}")
              if payload.get("sha") != entry.get("sha") or payload.get("encoding") != "base64":
                  raise RuntimeError(f"Immutable blob/tree binding failed for {path}")
              encoded = "".join((payload.get("content") or "").splitlines())
              contents[path] = base64.b64decode(encoded.encode("ascii"), validate=True).decode("utf-8")

          runtime = contents[runtime_path]
          helper_marker = '''def stop_report(
    pr: dict[str, Any],
    issue_number: int | None,
    reason: str,
    detail: str,
    close: bool = False,
) -> None:
'''
          helper_replacement = '''def _revalidate_stop_reason(
    pr_number: int,
    sha: str,
    issue_number: int | None,
    reason: str,
