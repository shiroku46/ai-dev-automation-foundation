name: Trusted Exact-SHA Checks
run-name: Trusted checks ${{ inputs.target_sha }}

on:
  workflow_dispatch:
    inputs:
      target_sha:
        description: Immutable same-repository commit SHA to validate
        required: true
        type: string

permissions: {}

concurrency:
  group: trusted-checks-${{ inputs.target_sha }}
  cancel-in-progress: false

jobs:
  authorize:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
      contents: read
    outputs:
      ci_check_id: ${{ steps.create.outputs.ci_check_id }}
      test_check_id: ${{ steps.create.outputs.test_check_id }}
    steps:
      - name: Authorize fixed default-branch workflow and create attestations
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          TARGET_SHA: ${{ inputs.target_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          EVENT_NAME: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ github.repository_owner }}
          CONFIGURED_OWNER: ${{ vars.AUTOMATION_OWNER }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          expected_workflow="$REPOSITORY/.github/workflows/trusted-checks.yml@refs/heads/$DEFAULT_BRANCH"
          test "$WORKFLOW_REF" = "$expected_workflow"
          test "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH"
          test "$EVENT_NAME" = workflow_dispatch
          default_sha=$(gh api "repos/$REPOSITORY/commits/$DEFAULT_BRANCH" --jq .sha)
          test "$WORKFLOW_SHA" = "$default_sha"

          actor_allowed=false
          if [ "$ACTOR" = "$OWNER" ] || [ "$ACTOR" = "github-actions[bot]" ]; then
            actor_allowed=true
          elif [ -n "$CONFIGURED_OWNER" ] && [ "$ACTOR" = "$CONFIGURED_OWNER" ]; then
            actor_allowed=true
          fi
          test "$actor_allowed" = true

          printf '%s' "$TARGET_SHA" | grep -Eq '^[0-9a-f]{40}$'
          resolved=$(gh api "repos/$REPOSITORY/commits/$TARGET_SHA" --jq .sha)
          test "$resolved" = "$TARGET_SHA"

          create_check() {
            name="$1"
            external_id="foundation:$RUN_ID:$name:$TARGET_SHA"
            gh api --method POST \
              -H "Accept: application/vnd.github+json" \
              "repos/$REPOSITORY/check-runs" \
              -f "name=$name" \
              -f "head_sha=$TARGET_SHA" \
              -f "status=in_progress" \
              -f "details_url=$RUN_URL" \
              -f "external_id=$external_id" \
              --jq .id
          }

          ci_check_id=$(create_check "CI / validate")
          test_check_id=$(create_check "Unit Tests / test")
          echo "ci_check_id=$ci_check_id" >> "$GITHUB_OUTPUT"
          echo "test_check_id=$test_check_id" >> "$GITHUB_OUTPUT"

  validate_target:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Verify immutable checked-out SHA
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Parse complete workflow YAML streams
        run: |
          ruby -e 'require "psych"; Dir[".github/workflows/*.{yml,yaml}"].sort.each { |path| documents = Psych.parse_stream(File.read(path)).children; raise "#{path}: expected exactly one YAML document" unless documents.length == 1 }'
      - run: python scripts/public_export_guard.py .
      - run: python scripts/validate_repository.py

  test_target:
    needs: authorize
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      TARGET_SHA: ${{ inputs.target_sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ env.TARGET_SHA }}
          persist-credentials: false
      - name: Verify immutable checked-out SHA
        run: test "$(git rev-parse HEAD)" = "$TARGET_SHA"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - run: python -m unittest discover -s tests

  finalize:
    needs: [authorize, validate_target, test_target]
    if: always() && needs.authorize.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      checks: write
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      CI_CHECK_ID: ${{ needs.authorize.outputs.ci_check_id }}
      TEST_CHECK_ID: ${{ needs.authorize.outputs.test_check_id }}
      VALIDATE_RESULT: ${{ needs.validate_target.result }}
      TEST_RESULT: ${{ needs.test_target.result }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - name: Finalize immutable attestations without executing proposed code
        run: |
          set -euo pipefail
          completed_at=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          ci_conclusion=failure
          test_conclusion=failure
          test "$VALIDATE_RESULT" = success && ci_conclusion=success
          test "$TEST_RESULT" = success && test_conclusion=success

          finish_check() {
            id="$1"
            conclusion="$2"
            title="$3"
            gh api --method PATCH \
              -H "Accept: application/vnd.github+json" \
              "repos/$REPOSITORY/check-runs/$id" \
              -f "status=completed" \
              -f "conclusion=$conclusion" \
              -f "completed_at=$completed_at" \
              -f "details_url=$RUN_URL" \
              -f "output[title]=$title" \
              -f "output[summary]=Trusted default-branch validation completed with conclusion: $conclusion" \
              >/dev/null
          }

          finish_check "$CI_CHECK_ID" "$ci_conclusion" "Trusted CI validation"
          finish_check "$TEST_CHECK_ID" "$test_conclusion" "Trusted unit tests"
          test "$ci_conclusion" = success
          test "$test_conclusion" = success
