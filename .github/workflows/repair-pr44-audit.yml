name: Repair PR 44 Remaining Audit Blockers

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: repair-pr-44-remaining-audit
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    env:
      TARGET_PR: "44"
      TARGET_BRANCH: fix/issue-36-human-notice-contract
      EXPECTED_HEAD: fe927718c7f70edc8cc04e4b5d3350eab93cbdb4
      REPAIR_SCRIPT_SHA256: 061ecaa6c95812339668d86e4ab5ceefdc747457b2431e3fee72f0c88698df7c
      REPAIR_SCRIPT_B64: 
    steps:
      - name: Apply immutable exact-scope audit repairs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import os

          compressed = base64.b64decode(os.environ["REPAIR_SCRIPT_B64"], validate=True)
          actual = hashlib.sha256(compressed).hexdigest()
          if actual != os.environ["REPAIR_SCRIPT_SHA256"]:
              raise RuntimeError("Fixed repair payload digest mismatch")
          script = gzip.decompress(compressed)
          exec(compile(script, "repair-pr44-audit.py", "exec"), {"__name__": "__main__"})
          PY
