name: Repair PR 44 Final Test Fixtures

on:
  push:
    branches: [main]
  schedule:
    - cron: "19 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: repair-pr-44-final-test-fixtures
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: write
      issues: read
      pull-requests: read
    steps:
      - name: Load immutable default-branch helper and repair fixed target
        env:
          GH_TOKEN: ${{ github.token }}
          HELPER_PATH: .github/scripts/repair-pr44-final-test-fixtures.py
        run: |
          set -euo pipefail
          helper_blob=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/git/trees/$GITHUB_SHA?recursive=1" \
            --jq ".tree[] | select(.path == \"$HELPER_PATH\" and .type == \"blob\") | .sha")
          if [ -z "$helper_blob" ]; then
            echo "Fixed helper is absent from the immutable default-branch commit." >&2
            exit 1
          fi
          metadata=$(gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/$GITHUB_REPOSITORY/contents/$HELPER_PATH?ref=$GITHUB_SHA")
          metadata_sha=$(printf '%s' "$metadata" | jq -r .sha)
          if [ "$metadata_sha" != "$helper_blob" ]; then
            echo "Fixed helper blob/tree binding failed." >&2
            exit 1
          fi
          printf '%s' "$metadata" \
            | jq -r .content \
            | tr -d '\n' \
            | base64 --decode > "$RUNNER_TEMP/repair-pr44-final-test-fixtures.py"
          python3 -m py_compile "$RUNNER_TEMP/repair-pr44-final-test-fixtures.py"
          python3 "$RUNNER_TEMP/repair-pr44-final-test-fixtures.py"
