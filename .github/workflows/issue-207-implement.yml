name: Issue 207 product check implementation

on:
  push:
    branches: [github/issue-207-product-checks]
    paths:
      - .github/workflows/issue-207-implement.yml

permissions: {}

jobs:
  implement:
    if: github.repository == 'shiroku46/ai-dev-automation-foundation' && github.actor == github.repository_owner
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: github/issue-207-product-checks
          fetch-depth: 0
      - name: Correct generated test literal escaping
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/issue-207-implement.py')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          customized = marker = 0
          for index, line in enumerate(lines):
              if '            customized = ' in line and 'product-ci.yml' in line:
                  if "\\n'" not in line:
                      raise SystemExit('customized literal no longer contains a newline escape')
                  lines[index] = line.replace("\\n'", "\\\\n'", 1)
                  customized += 1
              if 'INSTALL_CHECKLIST.md' in line and 'GENERATED_TARGET_MARKER +' in line:
                  if '"\\n")' not in line:
                      raise SystemExit('checklist literal no longer contains a newline escape')
                  lines[index] = line.replace('"\\n")', '"\\\\n")', 1)
                  marker += 1
          if customized != 1 or marker != 1:
              raise SystemExit(f'generated literal identities changed: customized={customized}, marker={marker}')
          path.write_text(''.join(lines), encoding='utf-8')
          PY
      - name: Apply exact authorized patch
        run: python .github/issue-207-implement.py
      - name: Correct parser and generated-target import parity
        run: |
          python - <<'PY'
          from pathlib import Path
          parser = Path('scripts/foundation_product_checks.py')
          content = parser.read_text(encoding='utf-8')
          old = '        if _WORKFLOW_RE.fullmatch(workflow) is None:\n            raise ProductCheckConfigError("product workflow path is unsafe")\n'
          new = '        if (\n            _WORKFLOW_RE.fullmatch(workflow) is None\n            or ".." in workflow.split("/")\n            or "//" in workflow\n        ):\n            raise ProductCheckConfigError("product workflow path is unsafe")\n'
          if content.count(old) != 1:
              raise SystemExit('product workflow safety pattern changed')
          parser.write_text(content.replace(old, new, 1), encoding='utf-8')

          validator = Path('scripts/validate_repository.py')
          content = validator.read_text(encoding='utf-8')
          old = 'from scripts.foundation_product_checks import (\n    CONFIG_PATH as PRODUCT_CHECKS_PATH,\n    ProductCheckConfigError,\n    parse_product_checks,\n)\n'
          new = 'try:\n    from scripts.foundation_product_checks import (\n        CONFIG_PATH as PRODUCT_CHECKS_PATH,\n        ProductCheckConfigError,\n        parse_product_checks,\n    )\nexcept ModuleNotFoundError:\n    from foundation_product_checks import (\n        CONFIG_PATH as PRODUCT_CHECKS_PATH,\n        ProductCheckConfigError,\n        parse_product_checks,\n    )\n'
          if content.count(old) != 1:
              raise SystemExit('validator product-check import pattern changed')
          validator.write_text(content.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Remove temporary transports
        run: |
          rm -f .github/issue-207-implement.py
          rm -f .github/workflows/issue-207-implement.yml
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
      - name: Verify exact scope and complete behavior
        run: |
          python - <<'PY'
          import subprocess
          expected = sorted([
              '.github/foundation-product-checks.json',
              'bootstrap/generator.py',
              'docs/OPERATING_RULES.md',
              'docs/PROJECT_STARTUP.md',
              'docs/PUBLIC_SECURITY_MODEL.md',
              'scripts/foundation_product_checks.py',
              'scripts/github_coordinator_supervisor.py',
              'scripts/public_export_guard.py',
              'scripts/validate_repository.py',
              'tests/test_bootstrap.py',
              'tests/test_export_guard.py',
              'tests/test_foundation_product_checks.py',
              'tests/test_github_coordinator_supervisor.py',
              'tests/test_runtime_scope_and_checks.py',
              'tests/test_workflow_security.py',
          ])
          actual = sorted(subprocess.check_output(
              ['git', 'diff', '--name-only', 'origin/main'], text=True
          ).splitlines())
          if actual != expected:
              raise SystemExit(f'exact scope mismatch: {actual!r}')
          PY
          git diff --check
          python -m py_compile \
            bootstrap/generator.py \
            scripts/foundation_product_checks.py \
            scripts/github_coordinator_supervisor.py \
            scripts/public_export_guard.py \
            scripts/validate_repository.py
          python -m unittest \
            tests.test_foundation_product_checks \
            tests.test_github_coordinator_supervisor \
            tests.test_bootstrap \
            tests.test_export_guard \
            tests.test_runtime_scope_and_checks \
            tests.test_workflow_security
          python scripts/public_export_guard.py .
          python scripts/validate_repository.py
          python -m unittest discover -s tests
          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f -name '*.pyc' -delete
          git diff --check
      - name: Commit validated production changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Enforce default-branch product workflow checks'
          git push origin HEAD:github/issue-207-product-checks
