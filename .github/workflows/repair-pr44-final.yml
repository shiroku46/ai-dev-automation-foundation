name: Repair PR 44 Final Audit

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: repair-pr-44-final-audit
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    env:
      TARGET_BRANCH: fix/issue-36-human-notice-contract
      TARGET_PR: "44"
      EXPECTED_HEAD: fe927718c7f70edc8cc04e4b5d3350eab93cbdb4
    steps:
      - name: Apply immutable audit-evidence repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess

          REPOSITORY = os.environ["GITHUB_REPOSITORY"]
          TARGET_BRANCH = os.environ["TARGET_BRANCH"]
          TARGET_PR = int(os.environ["TARGET_PR"])
          EXPECTED_HEAD = os.environ["EXPECTED_HEAD"]
          TARGET_PATHS = (
              "scripts/supervisor_runtime.py",
              "tests/test_runtime_human_notice.py",
              "tests/test_runtime_scope_and_checks.py",
          )

          CONSTANT_ANCHOR = 'SAFE_REASON = re.compile(r"^[A-Z0-9_]+$")\n'
          CONSTANT_REPLACEMENT = (
              CONSTANT_ANCHOR
              + 'REPOSITORY_TARGET = re.compile(r"^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$")\n'
              + 'SCOPE_STOP_REASONS = frozenset(\n'
              + '    {\n'
              + '        "MISSING_TRUSTED_SOURCE_ISSUE",\n'
              + '        "UNTRUSTED_SOURCE_ISSUE",\n'
              + '        "INCOMPLETE_CHANGED_FILE_EVIDENCE",\n'
              + '        "UNAUTHORIZED_CHANGED_PATH",\n'
              + '        "UNAUTHORIZED_PROTECTED_PATH",\n'
              + '    }\n'
              + ')\n'
          )
          FORMAT_OLD = '''        if len(target_list) != 2 or any("/" not in item for item in target_list):
            raise ValueError("repository-creation notice requires exactly two owner/name targets")
'''
          FORMAT_NEW = '''        if len(target_list) != 2 or any(
            REPOSITORY_TARGET.fullmatch(item) is None for item in target_list
        ):
            raise ValueError("repository-creation notice requires exactly two owner/name targets")
'''
          CONNECTED_OLD = '''    if len(targets) != 2 or any("/" not in target for target in targets):
        raise ValueError("repository-creation audit requires exactly two owner/name targets")
'''
          CONNECTED_NEW = '''    if len(targets) != 2 or any(
        REPOSITORY_TARGET.fullmatch(target) is None for target in targets
    ):
        raise ValueError("repository-creation audit requires exactly two owner/name targets")
'''
          STOP_OLD = '''    live = _live_pr(pr_number, sha)
    if reason == "MERGE_NOT_READY" and live.get("mergeable") is not False:
        raise RuntimeError("terminal mergeability changed before stop persistence")
    path = internal_stop_record_path(pr_number, sha, reason)
'''
          STOP_NEW = '''    live = _live_pr(pr_number, sha)
    if reason in SCOPE_STOP_REASONS:
        live_issue_number, _, _, live_scope_error = source_and_scope(live)
        if live_issue_number != issue_number or live_scope_error != reason:
            raise RuntimeError("scope stop reason changed before stop persistence")
    if reason == "MERGE_NOT_READY" and live.get("mergeable") is not False:
        raise RuntimeError("terminal mergeability changed before stop persistence")
    path = internal_stop_record_path(pr_number, sha, reason)
'''
          PERSIST_OLD = '''    _live_pr(pr_number, sha)
    persist_internal_stop_record(path, content, reason, pr_number)
    if close:
        _live_pr(pr_number, sha)
        gh("pr", "close", str(pr_number), "--repo", REPO)
'''
          PERSIST_NEW = '''    live = _live_pr(pr_number, sha)
    if reason in SCOPE_STOP_REASONS:
        live_issue_number, _, _, live_scope_error = source_and_scope(live)
        if live_issue_number != issue_number or live_scope_error != reason:
            raise RuntimeError("scope stop reason changed immediately before persistence")
    persist_internal_stop_record(path, content, reason, pr_number)
    if close:
        live = _live_pr(pr_number, sha)
        if reason in SCOPE_STOP_REASONS:
            live_issue_number, _, _, live_scope_error = source_and_scope(live)
            if live_issue_number != issue_number or live_scope_error != reason:
                raise RuntimeError("scope stop reason changed immediately before close")
        gh("pr", "close", str(pr_number), "--repo", REPO)
'''

          HUMAN_TEST_INSERT = r'''

class RepositoryTargetValidationTest(unittest.TestCase):
    def setUp(self):
        self.runtime = load_runtime()
        self.sha = "a" * 40
        self.reason = "HUMAN_ONLY_ACCOUNT_LEVEL_REPOSITORY_CREATION_UI_UNAVAILABLE"
        self.valid_targets = ("owner/foundation", "owner/foundation-e2e")

    def _fields(self, targets):
        attempted = tuple(f"GitHub API GET repos/{target}" for target in targets)
        impossible = tuple(
            f"GitHub API returned HTTP 404 for {target}; the exact repository is absent or unavailable to the connected token."
            for target in targets
        )
        return {
            "reason": self.reason,
            "issue_number": 58,
            "pr_number": 62,
            "exact_head_sha": self.sha,
            "attempted_connected_paths": attempted,
            "impossibility_evidence": impossible,
            "provider_ui_action": self.runtime.HUMAN_ONLY_ACTIONS[self.reason],
            "automatic_resume_condition": "Both exact repositories become visible.",
            "targets": targets,
        }

    def test_formatter_rejects_subresources_and_empty_components(self):
        invalid_sets = (
            ("owner/existing-repo/branches/missing", "owner/other"),
            ("owner/", "owner/other"),
            ("/repo", "owner/other"),
            ("owner/repo?ref=missing", "owner/other"),
        )
        for targets in invalid_sets:
            with self.subTest(targets=targets), self.assertRaises(ValueError):
                self.runtime.format_human_only_notice(**self._fields(targets))

    def test_connected_query_rejects_malformed_target_before_api_call(self):
        malformed = ("owner/existing-repo/branches/missing", "owner/other")
        with patch.object(self.runtime, "gh_result") as connected:
            with self.assertRaises(ValueError):
                self.runtime._connected_repository_creation_evidence(malformed)
        connected.assert_not_called()
'''

          SCOPE_TEST_INSERT = r'''

class StopReasonRevalidationTest(unittest.TestCase):
    def setUp(self):
        self.runtime = load_runtime()
        self.sha = SHA
        self.pr = {
            "number": PR_NUMBER,
            "state": "open",
            "head": {
                "sha": self.sha,
                "ref": "fix/probe",
                "repo": {"full_name": "example/foundation"},
            },
            "base": {
                "ref": "main",
                "repo": {"full_name": "example/foundation"},
            },
            "user": {"login": "owner"},
            "labels": [],
            "body": "Closes #9",
        }

    def test_cleared_scope_denial_writes_nothing(self):
        with (
            patch.object(self.runtime, "self_resolution_audit", return_value={"a": "1"}),
            patch.object(self.runtime, "_live_pr", return_value=self.pr),
            patch.object(
                self.runtime,
                "source_and_scope",
                return_value=(9, {"number": 9}, ["docs/probe.md"], None),
            ),
            patch.object(self.runtime, "persist_internal_stop_record") as persist,
        ):
            with self.assertRaisesRegex(RuntimeError, "scope stop reason changed"):
                self.runtime.stop_report(
                    self.pr,
                    9,
                    "UNAUTHORIZED_CHANGED_PATH",
                    "stale denial",
                    close=True,
                )
        persist.assert_not_called()

    def test_live_scope_denial_is_rechecked_before_persistence_and_close(self):
        with (
            patch.object(self.runtime, "self_resolution_audit", return_value={"a": "1"}),
            patch.object(self.runtime, "_live_pr", return_value=self.pr) as live,
            patch.object(
                self.runtime,
                "source_and_scope",
                return_value=(
                    9,
                    {"number": 9},
                    ["docs/probe.md"],
                    "UNAUTHORIZED_CHANGED_PATH",
                ),
            ) as source,
            patch.object(
                self.runtime, "persist_internal_stop_record", return_value=True
            ) as persist,
            patch.object(self.runtime, "gh") as gh,
        ):
            self.runtime.stop_report(
                self.pr,
                9,
                "UNAUTHORIZED_CHANGED_PATH",
                "current denial",
                close=True,
            )
        self.assertGreaterEqual(live.call_count, 3)
        self.assertEqual(source.call_count, 3)
        persist.assert_called_once()
        gh.assert_called_once_with("pr", "close", str(PR_NUMBER), "--repo", "example/foundation")
'''
          TEST_MARKER = '\n\nif __name__ == "__main__":\n    unittest.main()\n'

          def gh(*args, input_value=None):
              result = subprocess.run(
                  ["gh", *args],
                  input=input_value,
                  text=True,
                  capture_output=True,
                  check=False,
              )
              if result.returncode != 0:
                  raise RuntimeError(
                      "gh command failed: " + " ".join(args) + "\n" + result.stderr.strip()
                  )
              return result.stdout

          def api(path):
              return json.loads(
                  gh("api", "-H", "Accept: application/vnd.github+json", path)
              )

          def api_json(method, path, payload):
              return json.loads(
                  gh(
                      "api",
                      "--method",
                      method,
                      "-H",
                      "Accept: application/vnd.github+json",
                      "--input",
                      "-",
                      path,
                      input_value=json.dumps(payload),
                  )
              )

          pr = api(f"repos/{REPOSITORY}/pulls/{TARGET_PR}")
          head = pr.get("head") or {}
          base = pr.get("base") or {}
          if pr.get("state") != "open":
              print("Target Pull Request is no longer open; nothing to repair.")
              raise SystemExit(0)
          if (head.get("repo") or {}).get("full_name") != REPOSITORY:
              raise RuntimeError("Target Pull Request is not same-repository")
          if (base.get("repo") or {}).get("full_name") != REPOSITORY:
              raise RuntimeError("Target Pull Request base is not same-repository")
          if head.get("ref") != TARGET_BRANCH:
              raise RuntimeError("Target Pull Request branch changed")
          if head.get("sha") != EXPECTED_HEAD:
              print("Target head already moved; exact repair is no longer applicable.")
              raise SystemExit(0)

          commit = api(f"repos/{REPOSITORY}/git/commits/{EXPECTED_HEAD}")
          tree_sha = (commit.get("tree") or {}).get("sha")
          if not tree_sha:
              raise RuntimeError("Expected commit has no tree")
          tree = api(f"repos/{REPOSITORY}/git/trees/{tree_sha}?recursive=1")
          entries = {
              item.get("path"): item
              for item in tree.get("tree") or []
              if item.get("path") in TARGET_PATHS
          }
          if set(entries) != set(TARGET_PATHS):
              raise RuntimeError("Immutable expected tree does not contain exact target paths")

          texts = {}
          for path in TARGET_PATHS:
              metadata = api(f"repos/{REPOSITORY}/contents/{path}?ref={EXPECTED_HEAD}")
              if metadata.get("sha") != entries[path].get("sha"):
                  raise RuntimeError(f"Immutable blob/tree mismatch for {path}")
              if metadata.get("encoding") != "base64":
                  raise RuntimeError(f"Unexpected content encoding for {path}")
              texts[path] = base64.b64decode(
                  (metadata.get("content") or "").encode("ascii")
              ).decode("utf-8")

          runtime = texts["scripts/supervisor_runtime.py"]
          replacements = (
              (CONSTANT_ANCHOR, CONSTANT_REPLACEMENT),
              (FORMAT_OLD, FORMAT_NEW),
              (CONNECTED_OLD, CONNECTED_NEW),
              (STOP_OLD, STOP_NEW),
              (PERSIST_OLD, PERSIST_NEW),
          )
          for old, new in replacements:
              if runtime.count(old) != 1:
                  raise RuntimeError("Runtime replacement anchor count is not exactly one")
              runtime = runtime.replace(old, new, 1)

          human_tests = texts["tests/test_runtime_human_notice.py"]
          scope_tests = texts["tests/test_runtime_scope_and_checks.py"]
          for name, text, insertion in (
              ("human notice tests", human_tests, HUMAN_TEST_INSERT),
              ("scope tests", scope_tests, SCOPE_TEST_INSERT),
          ):
              if text.count(TEST_MARKER) != 1:
                  raise RuntimeError(f"{name} insertion marker count is not exactly one")
              if insertion.splitlines()[2] in text:
                  raise RuntimeError(f"{name} already contain the focused repair tests")
          human_tests = human_tests.replace(TEST_MARKER, HUMAN_TEST_INSERT + TEST_MARKER, 1)
          scope_tests = scope_tests.replace(TEST_MARKER, SCOPE_TEST_INSERT + TEST_MARKER, 1)

          replacements_by_path = {
              "scripts/supervisor_runtime.py": runtime,
              "tests/test_runtime_human_notice.py": human_tests,
              "tests/test_runtime_scope_and_checks.py": scope_tests,
          }
          tree_items = []
          for path in TARGET_PATHS:
              blob = api_json(
                  "POST",
                  f"repos/{REPOSITORY}/git/blobs",
                  {"content": replacements_by_path[path], "encoding": "utf-8"},
              )
              mode = entries[path].get("mode")
              if mode not in {"100644", "100755"}:
                  raise RuntimeError(f"Unexpected immutable mode for {path}: {mode}")
              tree_items.append(
                  {"path": path, "mode": mode, "type": "blob", "sha": blob["sha"]}
              )

          new_tree = api_json(
              "POST",
              f"repos/{REPOSITORY}/git/trees",
              {"base_tree": tree_sha, "tree": tree_items},
          )
          new_commit = api_json(
              "POST",
              f"repos/{REPOSITORY}/git/commits",
              {
                  "message": "Revalidate live scope stops and repository targets",
                  "tree": new_tree["sha"],
                  "parents": [EXPECTED_HEAD],
              },
          )

          live = api(f"repos/{REPOSITORY}/pulls/{TARGET_PR}")
          if (live.get("head") or {}).get("sha") != EXPECTED_HEAD:
              raise RuntimeError("Target Pull Request moved before exact ref update")
          if (live.get("head") or {}).get("ref") != TARGET_BRANCH:
              raise RuntimeError("Target Pull Request branch changed before exact ref update")
          api_json(
              "PATCH",
              f"repos/{REPOSITORY}/git/refs/heads/{TARGET_BRANCH}",
              {"sha": new_commit["sha"], "force": False},
          )
          print(f"Repaired PR #{TARGET_PR} to {new_commit['sha']}.")
          PY