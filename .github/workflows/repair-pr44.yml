name: Repair PR 44 Exact Scope

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: repair-pr-44-exact-scope
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    env:
      TARGET_BRANCH: fix/issue-36-human-notice-contract
      TARGET_PR: "44"
      EXPECTED_HEAD: 142a2b9a4a13fa8f10737a8167321d92f6069cdb
    steps:
      - name: Apply exact count-checked text repairs through Git data API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s' '' | base64 --decode | gzip --decompress | python3
