name: Repair PR 44 From Immutable Reviewed Payload

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: repair-pr-44-immutable-payload
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    env:
      TARGET_PR: "44"
      TARGET_BRANCH: fix/issue-36-human-notice-contract
      EXPECTED_HEAD: 142a2b9a4a13fa8f10737a8167321d92f6069cdb
      PAYLOAD_COMMIT: 6ee4c8975b0a9cd33cec017225bf730d7816190a
      PAYLOAD_BLOB: 50615c20bd2692ec56a60f143d6acc702d5a5afd
      PAYLOAD_PATH: .github/workflows/repair-pr44.yml
    steps:
      - name: Execute the fixed payload with immutable exact-head modes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import gzip
          import hashlib
          import json
          import os
          import re
          import subprocess

          repository = os.environ["GITHUB_REPOSITORY"]
          target_pr = int(os.environ["TARGET_PR"])
          target_branch = os.environ["TARGET_BRANCH"]
          expected_head = os.environ["EXPECTED_HEAD"]
          payload_commit = os.environ["PAYLOAD_COMMIT"]
          payload_blob = os.environ["PAYLOAD_BLOB"]
          payload_path = os.environ["PAYLOAD_PATH"]
          fixed_paths = (
              "scripts/supervisor_policy.py",
              "scripts/supervisor_runtime.py",
              "tests/test_runtime_human_notice.py",
              "tests/test_runtime_scope_and_checks.py",
          )

          def gh_json(*arguments: str) -> dict:
              output = subprocess.check_output(["gh", *arguments], text=True)
              return json.loads(output)

          live = gh_json("api", f"repos/{repository}/pulls/{target_pr}")
          if live["state"] != "open" or live["head"]["ref"] != target_branch:
              raise SystemExit("Fixed repair target is no longer the expected open Pull Request")
          if live["head"]["repo"]["full_name"] != repository:
              raise SystemExit("Fixed repair target is no longer same-repository")
          if live["head"]["sha"] != expected_head:
              print("PR #44 moved; this immutable repair is no longer applicable.")
              raise SystemExit(0)

          payload_commit_data = gh_json(
              "api", f"repos/{repository}/git/commits/{payload_commit}"
          )
          payload_tree = gh_json(
              "api",
              f"repos/{repository}/git/trees/{payload_commit_data['tree']['sha']}?recursive=1",
          )
          payload_matches = [
              item
              for item in payload_tree.get("tree") or []
              if item.get("path") == payload_path
          ]
          if len(payload_matches) != 1 or payload_matches[0].get("sha") != payload_blob:
              raise SystemExit("Immutable payload commit/path/blob binding failed")
          if payload_matches[0].get("mode") != "100644":
              raise SystemExit("Immutable payload workflow has an unexpected mode")

          blob = gh_json("api", f"repos/{repository}/git/blobs/{payload_blob}")
          if blob.get("encoding") != "base64":
              raise SystemExit("Immutable payload blob encoding is unexpected")
          workflow_bytes = base64.b64decode(str(blob.get("content") or ""), validate=True)
          git_blob_sha = hashlib.sha1(
              f"blob {len(workflow_bytes)}\0".encode("ascii") + workflow_bytes
          ).hexdigest()
          if git_blob_sha != payload_blob:
              raise SystemExit("Immutable payload blob hash verification failed")
          workflow = workflow_bytes.decode("utf-8")
          for marker in (
              f"TARGET_BRANCH: {target_branch}",
              f"TARGET_PR: \"{target_pr}\"",
              f"EXPECTED_HEAD: {expected_head}",
          ):
              if marker not in workflow:
                  raise SystemExit(f"Immutable payload workflow marker is missing: {marker}")

          payloads = re.findall(
              r"printf '%s' '([A-Za-z0-9+/=]+)' \| base64 --decode "
              r"\| gzip --decompress \| python3",
              workflow,
          )
          if len(payloads) != 1:
              raise SystemExit("Immutable workflow does not contain one exact repair payload")
          source = gzip.decompress(base64.b64decode(payloads[0], validate=True)).decode(
              "utf-8"
          )
          for marker in (
              'f"?ref={quote(expected_head)}"',
              'if current_head != expected_head:',
              'force=False',
          ):
              if marker not in source:
                  raise SystemExit(f"Reviewed repair source marker is missing: {marker}")
          if 'f"?ref={quote(target_branch)}"' in source:
              raise SystemExit("Reviewed repair source still reads a moving branch")

          base_commit = gh_json("api", f"repos/{repository}/git/commits/{expected_head}")
          base_tree = gh_json(
              "api",
              f"repos/{repository}/git/trees/{base_commit['tree']['sha']}?recursive=1",
          )
          modes = {
              str(item["path"]): str(item["mode"])
              for item in base_tree.get("tree") or []
              if item.get("path") in fixed_paths
          }
          if set(modes) != set(fixed_paths):
              raise SystemExit("Immutable base tree does not contain every fixed repair path")
          if any(mode not in {"100644", "100755"} for mode in modes.values()):
              raise SystemExit("Immutable base tree contains a non-regular repair path")

          old_mode = '"mode": "100644"'
          if source.count(old_mode) != 1:
              raise SystemExit("Reviewed repair source mode expression is not unique")
          mode_expression = '"mode": ' + repr(modes) + '[path]'
          source = source.replace(old_mode, mode_expression, 1)
          compile(source, "immutable-repair-pr44.py", "exec")
          exec(compile(source, "immutable-repair-pr44.py", "exec"), {"__name__": "__main__"})
          PY
