name: Trusted Recovery and Merge Supervisor

on:
  workflow_run:
    workflows: ["Trusted Exact-SHA Checks"]
    types: [completed]
  issue_comment:
    types: [created]
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: foundation-supervisor
  cancel-in-progress: false

jobs:
  supervise:
    if: |
      github.event_name != 'workflow_dispatch' ||
      github.actor == github.repository_owner ||
      (vars.AUTOMATION_OWNER != '' && github.actor == vars.AUTOMATION_OWNER)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Reconcile bounded same-repository candidates
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AUTOMATION_OWNER: ${{ vars.AUTOMATION_OWNER || github.repository_owner }}
        run: python -m scripts.supervisor_runtime
