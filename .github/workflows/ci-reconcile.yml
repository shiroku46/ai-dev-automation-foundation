name: Trusted CI Reconciliation

on:
  workflow_run:
    workflows: ["CI", "Unit Tests"]
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

concurrency:
  group: trusted-ci-reconcile
  cancel-in-progress: false

permissions: {}

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Discover bounded exact-SHA candidates without valid or active attestations
        id: discover
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          AUTOMATION_OWNER: ${{ vars.AUTOMATION_OWNER || github.repository_owner }}
        run: |
          matrix=$(python -m scripts.supervisor_runtime discover)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  attest:
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        target_sha: ${{ fromJSON(needs.discover.outputs.matrix) }}
    uses: ./.github/workflows/trusted-checks.yml
    with:
      target_sha: ${{ matrix.target_sha }}
    permissions:
      actions: read
      checks: write
      contents: read
