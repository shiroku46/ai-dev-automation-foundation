name: Trusted CI Reconciliation

on:
  workflow_run:
    workflows: ["CI", "Unit Tests", "Claude Issue Queue"]
    types: [completed]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: trusted-ci-reconciliation
  cancel-in-progress: false

jobs:
  observe:
    if: github.event_name == 'workflow_run' && github.event.workflow_run.path != '.github/workflows/claude-queue.yml'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    steps:
      - name: Record read-only native evidence observation
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          WORKFLOW_HEAD: ${{ github.event.workflow_run.head_sha }}
          WORKFLOW_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          {
            echo "## Trusted CI reconciliation"
            echo
            echo "- mode: read-only compatibility observation"
            echo "- event: \`$EVENT_NAME\`"
            echo "- workflow: \`${WORKFLOW_NAME:-manual}\`"
            echo "- exact_head: \`${WORKFLOW_HEAD:-none}\`"
            echo "- conclusion: \`${WORKFLOW_CONCLUSION:-none}\`"
            echo "- provider_invocation: false"
            echo "- human_action_required: false"
          } >> "$GITHUB_STEP_SUMMARY"

  queue_recovery:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.path == '.github/workflows/claude-queue.yml'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      issues: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Consume verified checkpoints or dispatch one bounded retry
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          OWNER: ${{ vars.AUTOMATION_OWNER || github.repository_owner }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
        run: |
          python3 - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          import json
          import os
          import pathlib
          import re
          import stat
          import subprocess
          import tempfile
          import urllib.parse
          import zipfile
          from typing import Any

          from scripts import supervisor_policy as policy
          from scripts.queue_failure_classifier import (
              FailureClass,
              build_failure_status,
              classify_conclusion,
              should_auto_retry,
          )

          repository = os.environ["REPOSITORY"]
          default_branch = os.environ["DEFAULT_BRANCH"]
          owner = os.environ["OWNER"]
          event_name = os.environ["EVENT_NAME"]
          event = json.loads(pathlib.Path(os.environ["EVENT_PATH"]).read_text(encoding="utf-8"))
          exact_sha = re.compile(r"^[0-9a-f]{40}$")
          queue_workflow = "claude-queue.yml"
          queue_name = "Claude Issue Queue"
          stop_branch = "automation-internal-stops"
          retry_root = "automation-stops/queue-v4"
          max_retries = 3

          def gh_bytes(*args: str, check: bool = True) -> bytes:
              result = subprocess.run(["gh", *args], capture_output=True, check=False)
              if check and result.returncode != 0:
                  raise RuntimeError(result.stderr.decode("utf-8", errors="replace").strip())
              return result.stdout

          def gh(*args: str, check: bool = True) -> str:
              return gh_bytes(*args, check=check).decode("utf-8")

          def api(path: str) -> Any:
              return json.loads(gh("api", "-H", "Accept: application/vnd.github+json", path))

          def api_pages(path: str, key: str | None = None) -> list[dict[str, Any]]:
              payload = json.loads(gh("api", "-H", "Accept: application/vnd.github+json", "--paginate", "--slurp", path))
              values: list[dict[str, Any]] = []
              for page in payload:
                  items = page if key is None else page.get(key, [])
                  if not isinstance(items, list):
                      raise RuntimeError("paginated GitHub evidence is incomplete")
                  values.extend(items)
              return values

          def current_default_sha() -> str:
              sha = str(api(f"repos/{repository}/commits/{default_branch}").get("sha") or "")
              if not exact_sha.fullmatch(sha):
                  raise RuntimeError("default branch did not resolve exactly")
              return sha

          def trusted_issue(number: int) -> dict[str, Any]:
              issue = api(f"repos/{repository}/issues/{number}")
              if (
                  issue.get("state") != "open"
                  or issue.get("pull_request")
                  or ((issue.get("user") or {}).get("login") or "").casefold() != owner.casefold()
              ):
                  raise RuntimeError("Queue source Issue is not trusted and open")
              return issue

          def trigger_identity(issue: dict[str, Any]) -> dict[str, Any] | None:
              body = re.sub(r"<!--.*?-->", "", str(issue.get("body") or ""), flags=re.S)
              first = next((line.strip() for line in body.splitlines() if line.strip()), "")
              if first == "/claude-run":
                  return {
                      "kind": "issue-body",
                      "id": int(issue.get("number") or 0),
                      "created_at": str(issue.get("created_at") or ""),
                  }
              number = int(issue.get("number") or 0)
              comments = api_pages(f"repos/{repository}/issues/{number}/comments?per_page=100")
              matches = [
                  item for item in comments
                  if ((item.get("user") or {}).get("login") or "").casefold() == owner.casefold()
                  and str(item.get("body") or "").strip() == "/claude-run"
              ]
              if not matches:
                  return None
              selected = max(matches, key=lambda item: (str(item.get("created_at") or ""), int(item.get("id") or 0)))
              return {
                  "kind": "issue-comment",
                  "id": int(selected.get("id") or 0),
                  "created_at": str(selected.get("created_at") or ""),
                  "updated_at": str(selected.get("updated_at") or ""),
              }

          def request_fingerprint(issue: dict[str, Any], base_sha: str) -> str:
              trigger = trigger_identity(issue)
              if trigger is None or not trigger.get("id") or not trigger.get("created_at"):
                  raise RuntimeError("Queue trigger identity is missing")
              payload = {
                  "base_sha": base_sha,
                  "issue_body": str(issue.get("body") or ""),
                  "issue_number": int(issue["number"]),
                  "issue_title": str(issue.get("title") or ""),
                  "trigger": trigger,
              }
              raw = json.dumps(payload, sort_keys=True, separators=(",", ":")).encode("utf-8")
              return hashlib.sha256(raw).hexdigest()[:20]

          def active_queue_run() -> bool:
              runs = api_pages(f"repos/{repository}/actions/workflows/{queue_workflow}/runs?per_page=100", "workflow_runs")
              return any(
                  run.get("name") == queue_name
                  and run.get("head_branch") == default_branch
                  and str(run.get("status") or "") in {"queued", "in_progress", "waiting", "pending", "requested"}
                  for run in runs
              )

          def open_pulls() -> list[dict[str, Any]]:
              return api_pages(f"repos/{repository}/pulls?state=open&per_page=100")

          def candidate_for_issue(issue_number: int) -> list[dict[str, Any]]:
              prefixes = (
                  f"claude-issue-{issue_number}-",
                  f"automation/queue-issue-{issue_number}-",
                  f"automation/issue-{issue_number}-",
              )
              matches = []
              for pull in open_pulls():
                  head = pull.get("head") or {}
                  if ((head.get("repo") or {}).get("full_name") != repository):
                      continue
                  body = str(pull.get("body") or "")
                  linked = bool(re.search(rf"(?im)\b(?:closes|fixes|resolves)\s+#{issue_number}\b", body))
                  if str(head.get("ref") or "").startswith(prefixes) or linked:
                      matches.append(pull)
              return matches

          def ensure_stop_branch(base_sha: str) -> None:
              result = subprocess.run(
                  ["gh", "api", f"repos/{repository}/git/ref/heads/{stop_branch}"],
                  capture_output=True, text=True, check=False,
              )
              if result.returncode == 0:
                  return
              if "404" not in (result.stdout + result.stderr):
                  raise RuntimeError("could not inspect recovery record branch")
              subprocess.run(
                  ["gh", "api", "--method", "POST", f"repos/{repository}/git/refs", "-f", f"ref=refs/heads/{stop_branch}", "-f", f"sha={base_sha}"],
                  check=True,
              )

          def record_path(issue_number: int, fingerprint: str, name: str) -> str:
              return f"{retry_root}/issue-{issue_number}/request-{fingerprint}/{name}"

          def read_record(path: str) -> dict[str, Any] | None:
              encoded_path = urllib.parse.quote(path, safe="/")
              result = subprocess.run(
                  ["gh", "api", f"repos/{repository}/contents/{encoded_path}?ref={stop_branch}"],
                  capture_output=True, text=True, check=False,
              )
              if result.returncode != 0:
                  if "404" in (result.stdout + result.stderr):
                      return None
                  raise RuntimeError("could not read recovery record")
              payload = json.loads(result.stdout)
              raw = base64.b64decode(str(payload.get("content") or "").replace("\n", ""))
              value = json.loads(raw)
              if not isinstance(value, dict):
                  raise RuntimeError("recovery record is not an object")
              return value

          def put_record(path: str, payload: dict[str, Any], message: str, base_sha: str) -> bool:
              ensure_stop_branch(base_sha)
              existing = read_record(path)
              if existing is not None:
                  if existing != payload:
                      raise RuntimeError("deterministic recovery record identity changed")
                  return False
              content = base64.b64encode(
                  (json.dumps(payload, sort_keys=True, separators=(",", ":")) + "\n").encode("utf-8")
              ).decode("ascii")
              encoded_path = urllib.parse.quote(path, safe="/")
              result = subprocess.run(
                  ["gh", "api", "--method", "PUT", f"repos/{repository}/contents/{encoded_path}", "-f", f"message={message}", "-f", f"content={content}", "-f", f"branch={stop_branch}"],
                  capture_output=True, text=True, check=False,
              )
              if result.returncode == 0:
                  return True
              if read_record(path) == payload:
                  return False
              raise RuntimeError("could not persist deterministic recovery record")

          def retry_records(issue_number: int, fingerprint: str) -> list[dict[str, Any]]:
              root = record_path(issue_number, fingerprint, "").rstrip("/")
              encoded = urllib.parse.quote(root, safe="/")
              result = subprocess.run(
                  ["gh", "api", f"repos/{repository}/contents/{encoded}?ref={stop_branch}"],
                  capture_output=True, text=True, check=False,
              )
              if result.returncode != 0:
                  if "404" in (result.stdout + result.stderr):
                      return []
                  raise RuntimeError("could not list recovery records")
              items = json.loads(result.stdout)
              records = []
              for item in items:
                  match = re.fullmatch(r"retry-([1-9][0-9]*)\.json", str(item.get("name") or ""))
                  if match:
                      value = read_record(f"{root}/{item['name']}")
                      if value is not None:
                          records.append(value)
              return sorted(records, key=lambda item: int(item.get("attempt") or 0))

          def dispatch_retry(issue: dict[str, Any], base_sha: str, failure_class: FailureClass, source_run_id: int | None) -> bool:
              issue_number = int(issue["number"])
              fingerprint = request_fingerprint(issue, base_sha)
              if any(
                  read_record(record_path(issue_number, fingerprint, name)) is not None
                  for name in ("internal-stop.json", "exhausted.json")
              ):
                  return False
              records = retry_records(issue_number, fingerprint)
              attempt = len(records) + 1
              status = build_failure_status(
                  failure_class=failure_class,
                  retry_attempt=len(records),
                  max_retries=max_retries,
                  checkpoint_sha=None,
              )
              if not should_auto_retry(failure_class, len(records), max_retries):
                  name = "exhausted.json" if len(records) >= max_retries else "internal-stop.json"
                  next_action = (
                      "optional provider route unavailable; continue GitHub-direct work"
                      if failure_class is FailureClass.AUTH_SECRET
                      else status.next_automatic_action
                  )
                  put_record(
                      record_path(issue_number, fingerprint, name),
                      {
                          "attempt": len(records),
                          "base_sha": base_sha,
                          "failure_class": status.failure_class.value,
                          "human_action_required": False,
                          "issue_number": issue_number,
                          "next_automatic_action": next_action,
                          "notification": False,
                          "request_fingerprint": fingerprint,
                          "source_run_id": source_run_id,
                      },
                      f"Record Queue recovery stop for Issue #{issue_number}",
                      base_sha,
                  )
                  return False
              payload = {
                  "attempt": attempt,
                  "base_sha": base_sha,
                  "failure_class": failure_class.value,
                  "human_action_required": False,
                  "issue_number": issue_number,
                  "next_automatic_action": "dispatch one optional Queue retry",
                  "notification": False,
                  "request_fingerprint": fingerprint,
                  "source_run_id": source_run_id,
              }
              path = record_path(issue_number, fingerprint, f"retry-{attempt}.json")
              if not put_record(path, payload, f"Record Queue retry {attempt} for Issue #{issue_number}", base_sha):
                  return False
              if current_default_sha() != base_sha or active_queue_run() or candidate_for_issue(issue_number):
                  return False
              gh(
                  "workflow", "run", queue_workflow,
                  "--repo", repository,
                  "--ref", default_branch,
                  "-f", f"issue_number={issue_number}",
                  "-f", f"request_fingerprint={fingerprint}",
                  "-f", f"retry_attempt={attempt}",
              )
              return True

          def failure_class_for_run(run: dict[str, Any]) -> FailureClass:
              run_id = int(run.get("id") or 0)
              jobs = api_pages(f"repos/{repository}/actions/runs/{run_id}/jobs?filter=all&per_page=100", "jobs")
              failed = [
                  job for job in jobs
                  if job.get("status") == "completed"
                  and str(job.get("conclusion") or "") not in {"success", "skipped", "neutral", ""}
              ]
              detail_parts = [str(run.get("conclusion") or "")]
              permission_denials = 0
              for job in failed:
                  for step in job.get("steps") or []:
                      if str(step.get("conclusion") or "") == "failure":
                          name = str(step.get("name") or "").lower()
                          detail_parts.append(name)
                          if any(token in name for token in ("permission", "allowedtools", "not allowed", "tool policy")):
                              permission_denials += 1
                  job_id = int(job.get("id") or 0)
                  if job_id > 0:
                      logs = gh_bytes("api", f"repos/{repository}/actions/jobs/{job_id}/logs", check=False)
                      low = logs.decode("utf-8", errors="replace").lower()
                      for marker in (
                          "error_max_turns", "max turns", "connect tunnel", "could not resolve host",
                          "connection reset", "network is unreachable", "token expired",
                          "authentication failed", "bad credentials", "missing secret", "http 401", "http 403",
                          "assertionerror", "tests failed", "service unavailable",
                          "runner lost communication", "timed out",
                      ):
                          if marker in low:
                              detail_parts.append(marker)
                      if any(marker in low for marker in ("tool policy", "allowedtools", "command is not allowed")):
                          permission_denials += 1
              conclusion = str(run.get("conclusion") or "failure")
              if any(part in {"error_max_turns", "max turns"} for part in detail_parts):
                  conclusion = "error_max_turns"
              return classify_conclusion(conclusion, permission_denials, "; ".join(detail_parts))

          def verify_artifact(run: dict[str, Any], issue: dict[str, Any]) -> tuple[pathlib.Path, dict[str, Any], str] | None:
              run_id = int(run.get("id") or 0)
              artifacts = api(f"repos/{repository}/actions/runs/{run_id}/artifacts?per_page=100").get("artifacts") or []
              expected_names = {f"queue-complete-{run_id}", f"queue-wip-{run_id}"}
              matches = [item for item in artifacts if item.get("name") in expected_names and not item.get("expired")]
              if not matches:
                  return None
              if len(matches) != 1:
                  raise RuntimeError("Queue checkpoint artifact identity is ambiguous")
              artifact = matches[0]
              kind = "complete" if artifact["name"].startswith("queue-complete-") else "wip"
              if kind == "complete":
                  jobs = api_pages(f"repos/{repository}/actions/runs/{run_id}/jobs?filter=all&per_page=100", "jobs")
                  verify_jobs = [job for job in jobs if str(job.get("name") or "").split(" /", 1)[0] == "verify"]
                  if len(verify_jobs) != 1 or verify_jobs[0].get("conclusion") != "success":
                      raise RuntimeError("complete Queue artifact lacks successful read-only verification")
              temp = pathlib.Path(tempfile.mkdtemp(prefix="queue-artifact-"))
              archive = temp / "artifact.zip"
              with archive.open("wb") as handle:
                  subprocess.run(["gh", "api", f"repos/{repository}/actions/artifacts/{int(artifact['id'])}/zip"], stdout=handle, check=True)
              with zipfile.ZipFile(archive) as zipped:
                  members = zipped.infolist()
                  names = {member.filename for member in members}
                  if names != {"candidate.patch", "checkpoint.json"}:
                      raise RuntimeError("Queue artifact contains unexpected members")
                  for member in members:
                      mode = member.external_attr >> 16
                      if member.is_dir() or stat.S_ISLNK(mode) or pathlib.PurePosixPath(member.filename).is_absolute():
                          raise RuntimeError("Queue artifact contains an unsafe member")
                  zipped.extractall(temp / "payload")
              payload_root = temp / "payload"
              raw_metadata = (payload_root / "checkpoint.json").read_bytes()
              patch_bytes = (payload_root / "candidate.patch").read_bytes()
              metadata = json.loads(raw_metadata)
              base_sha = str(run.get("head_sha") or "")
              if (
                  metadata.get("version") != 1
                  or metadata.get("base_sha") != base_sha
                  or metadata.get("checkpoint_kind") != kind
                  or metadata.get("retry_identity") != f"run-{run_id}-attempt-{int(run.get('run_attempt') or 1)}"
                  or metadata.get("patch_sha256") != hashlib.sha256(patch_bytes).hexdigest()
              ):
                  raise RuntimeError("Queue artifact metadata identity is invalid")
              digest = hashlib.sha256(raw_metadata + patch_bytes).hexdigest()
              return payload_root, metadata, digest

          def publish_artifact(run: dict[str, Any], issue: dict[str, Any], artifact: tuple[pathlib.Path, dict[str, Any], str]) -> int:
              payload_root, metadata, digest = artifact
              issue_number = int(issue["number"])
              run_id = int(run["id"])
              base_sha = str(metadata["base_sha"])
              if current_default_sha() != base_sha:
                  raise RuntimeError("default branch moved before checkpoint publication")
              existing = candidate_for_issue(issue_number)
              branch = f"automation/queue-issue-{issue_number}-run-{run_id}"
              foreign = [pull for pull in existing if str((pull.get("head") or {}).get("ref") or "") != branch]
              if foreign:
                  raise RuntimeError("a different live candidate already owns this Issue")

              subprocess.run(["git", "checkout", "--detach", base_sha], check=True)
              subprocess.run(["git", "reset", "--hard", base_sha], check=True)
              subprocess.run(["git", "clean", "-fdx"], check=True)
              subprocess.run(["git", "apply", "--check", "--index", str(payload_root / "candidate.patch")], check=True)
              subprocess.run(["git", "apply", "--index", str(payload_root / "candidate.patch")], check=True)
              changed = subprocess.check_output(["git", "diff", "--cached", "--name-only", "--no-renames", "-z", base_sha, "--"])
              changed_paths = sorted(item.decode("utf-8") for item in changed.split(b"\0") if item)
              declared = sorted(str(item) for item in metadata.get("changed_paths") or [])
              if changed_paths != declared or not policy.scope_is_authorized(changed_paths, str(issue.get("body") or "")):
                  raise RuntimeError("checkpoint changed paths exceed the trusted Issue scope")
              if not policy.protected_scope_is_authorized(changed_paths, str(issue.get("body") or "")):
                  raise RuntimeError("checkpoint protected paths lack exact authorization")
              if any(
                  pathlib.PurePosixPath(path).is_absolute()
                  or ".." in pathlib.PurePosixPath(path).parts
                  or path == ".git"
                  or path.startswith(".git/")
                  for path in changed_paths
              ):
                  raise RuntimeError("checkpoint contains an unsafe path")

              tree_sha = subprocess.check_output(["git", "write-tree"], text=True).strip()
              ref_result = subprocess.run(
                  ["gh", "api", f"repos/{repository}/git/ref/heads/{urllib.parse.quote(branch, safe='')}"],
                  capture_output=True, text=True, check=False,
              )
              if ref_result.returncode == 0:
                  branch_sha = str((json.loads(ref_result.stdout).get("object") or {}).get("sha") or "")
                  commit = api(f"repos/{repository}/git/commits/{branch_sha}")
                  parents = [str(item.get("sha") or "") for item in commit.get("parents") or []]
                  if str((commit.get("tree") or {}).get("sha") or "") != tree_sha or parents != [base_sha]:
                      raise RuntimeError("existing recovery branch does not match the verified checkpoint")
                  candidate_sha = branch_sha
              else:
                  timestamp = str(run.get("created_at") or "1970-01-01T00:00:00Z")
                  env = {
                      **os.environ,
                      "GIT_AUTHOR_NAME": "github-actions[bot]",
                      "GIT_AUTHOR_EMAIL": "41898282+github-actions[bot]@users.noreply.github.com",
                      "GIT_COMMITTER_NAME": "github-actions[bot]",
                      "GIT_COMMITTER_EMAIL": "41898282+github-actions[bot]@users.noreply.github.com",
                      "GIT_AUTHOR_DATE": timestamp,
                      "GIT_COMMITTER_DATE": timestamp,
                  }
                  candidate_sha = subprocess.check_output(
                      ["git", "commit-tree", tree_sha, "-p", base_sha, "-m", f"Recover Queue checkpoint for Issue #{issue_number}"],
                      text=True, env=env,
                  ).strip()
                  subprocess.run(["git", "push", "origin", f"{candidate_sha}:refs/heads/{branch}"], check=True)

              exact = api(f"repos/{repository}/commits/{candidate_sha}")
              if exact.get("sha") != candidate_sha:
                  raise RuntimeError("published recovery candidate did not resolve exactly")
              if current_default_sha() != base_sha:
                  raise RuntimeError("default branch moved during checkpoint publication")
              if existing:
                  pull = existing[0]
                  if str((pull.get("head") or {}).get("sha") or "") != candidate_sha:
                      raise RuntimeError("existing candidate Pull Request head is not the verified checkpoint")
                  return int(pull["number"])

              body = "\n".join([
                  f"Closes #{issue_number}",
                  "",
                  "## Queue recovery identity",
                  f"- source_run: `{run_id}`",
                  f"- exact_base_sha: `{base_sha}`",
                  f"- artifact_sha256: `{digest}`",
                  f"- checkpoint_kind: `{metadata['checkpoint_kind']}`",
                  f"- exact_head_sha: `{candidate_sha}`",
                  f"- changed_paths: `{json.dumps(changed_paths, separators=(',', ':'))}`",
                  "- implementation_route: `claude-optional -> github-direct`",
                  "- review_route: `github-coordinator`",
                  "- review_state: `required`",
                  "- unresolved_review_threads: `0`",
                  "- human_action_required: `false`",
                  "",
                  "Candidate bytes were applied but not executed by the write-capable publication job. Public read-only CI and Unit Tests must validate this exact head before review or merge.",
              ])
              response = json.loads(gh(
                  "api", "--method", "POST", f"repos/{repository}/pulls",
                  "-f", f"title=Recover verified Queue checkpoint for Issue #{issue_number}",
                  "-f", f"head={branch}", "-f", f"base={default_branch}",
                  "-f", f"body={body}", "-F", "draft=true",
              ))
              return int(response["number"])

          def resume_remote_branch(issue: dict[str, Any], base_sha: str) -> int | None:
              issue_number = int(issue["number"])
              branches = api_pages(f"repos/{repository}/branches?per_page=100")
              matches = [item for item in branches if str(item.get("name") or "").startswith(f"claude-issue-{issue_number}-")]
              if not matches:
                  return None
              if len(matches) != 1:
                  raise RuntimeError("remote Queue checkpoint branches are ambiguous")
              branch = str(matches[0]["name"])
              sha = str((matches[0].get("commit") or {}).get("sha") or "")
              compare = api(f"repos/{repository}/compare/{base_sha}...{sha}")
              if compare.get("status") != "ahead" or int(compare.get("behind_by") or 0) != 0:
                  raise RuntimeError("remote Queue checkpoint is not based on the exact default SHA")
              files = compare.get("files") or []
              if not isinstance(files, list) or len(files) >= 300:
                  raise RuntimeError("remote Queue checkpoint changed-file evidence is incomplete")
              changed_paths = sorted(str(item.get("filename") or "") for item in files)
              if not changed_paths or not policy.scope_is_authorized(changed_paths, str(issue.get("body") or "")):
                  raise RuntimeError("remote Queue checkpoint exceeds Issue scope")
              if not policy.protected_scope_is_authorized(changed_paths, str(issue.get("body") or "")):
                  raise RuntimeError("remote Queue checkpoint lacks protected authorization")
              existing = candidate_for_issue(issue_number)
              foreign = [pull for pull in existing if str((pull.get("head") or {}).get("ref") or "") != branch]
              if foreign:
                  raise RuntimeError("another candidate already owns the Issue")
              if existing:
                  return int(existing[0]["number"])
              body = "\n".join([
                  f"Closes #{issue_number}", "", "## Remote checkpoint recovery",
                  f"- exact_base_sha: `{base_sha}`", f"- exact_head_sha: `{sha}`",
                  f"- checkpoint_branch: `{branch}`", "- implementation_route: `claude-optional -> github-direct`",
                  "- review_route: `github-coordinator`", "- review_state: `required`",
                  "- human_action_required: `false`",
              ])
              response = json.loads(gh(
                  "api", "--method", "POST", f"repos/{repository}/pulls",
                  "-f", f"title=Resume Queue checkpoint for Issue #{issue_number}",
                  "-f", f"head={branch}", "-f", f"base={default_branch}",
                  "-f", f"body={body}", "-F", "draft=true",
              ))
              return int(response["number"])

          def issue_from_run(run: dict[str, Any]) -> dict[str, Any]:
              title = str(run.get("display_title") or "")
              match = re.fullmatch(r"Optional Claude issue-([1-9][0-9]*)", title)
              if match is None:
                  raise RuntimeError("Queue run title does not identify exactly one Issue")
              return trusted_issue(int(match.group(1)))

          def latest_verified_artifact(issue: dict[str, Any], base_sha: str) -> tuple[dict[str, Any], tuple[pathlib.Path, dict[str, Any], str]] | None:
              issue_number = int(issue["number"])
              runs = api_pages(
                  f"repos/{repository}/actions/workflows/{queue_workflow}/runs?per_page=100",
                  "workflow_runs",
              )
              candidates = sorted(
                  (
                      run for run in runs
                      if run.get("name") == queue_name
                      and run.get("display_title") == f"Optional Claude issue-{issue_number}"
                      and str(run.get("path") or "").split("@", 1)[0] == ".github/workflows/claude-queue.yml"
                      and run.get("head_branch") == default_branch
                      and run.get("head_sha") == base_sha
                      and run.get("status") == "completed"
                      and ((run.get("repository") or {}).get("full_name") or repository) == repository
                  ),
                  key=lambda run: (
                      int(run.get("run_number") or 0),
                      int(run.get("run_attempt") or 0),
                      int(run.get("id") or 0),
                  ),
                  reverse=True,
              )
              for run in candidates:
                  artifact = verify_artifact(run, issue)
                  if artifact is not None:
                      return run, artifact
              return None

          base_sha = current_default_sha()
          action = "none"
          selected_issue: dict[str, Any] | None = None
          source_run_id: int | None = None

          if event_name == "workflow_run":
              run = event.get("workflow_run") or {}
              if (
                  run.get("name") != queue_name
                  or str(run.get("path") or "").split("@", 1)[0] != ".github/workflows/claude-queue.yml"
                  or run.get("head_branch") != default_branch
                  or run.get("status") != "completed"
                  or ((run.get("repository") or {}).get("full_name") or repository) != repository
              ):
                  raise RuntimeError("workflow_run is not the fixed Queue completion")
              selected_issue = issue_from_run(run)
              source_run_id = int(run.get("id") or 0)
              artifact = verify_artifact(run, selected_issue)
              if artifact is not None:
                  resumed = resume_remote_branch(selected_issue, base_sha)
                  if resumed is not None:
                      action = f"resumed_pr_{resumed}"
                  else:
                      pr_number = publish_artifact(run, selected_issue, artifact)
                      action = f"published_pr_{pr_number}"
              elif not candidate_for_issue(int(selected_issue["number"])):
                  failure_class = failure_class_for_run(run)
                  if dispatch_retry(selected_issue, base_sha, failure_class, source_run_id):
                      action = "retry_dispatched"
                  else:
                      action = f"stopped_{failure_class.value}"
          else:
              if not active_queue_run():
                  issues = api_pages(f"repos/{repository}/issues?state=open&sort=updated&direction=desc&per_page=100")
                  for issue_record in issues:
                      if issue_record.get("pull_request"):
                          continue
                      try:
                          issue = trusted_issue(int(issue_record.get("number") or 0))
                      except RuntimeError:
                          continue
                      if trigger_identity(issue) is None or candidate_for_issue(int(issue["number"])):
                          continue
                      selected_issue = issue
                      resumed = resume_remote_branch(issue, base_sha)
                      if resumed is not None:
                          action = f"resumed_pr_{resumed}"
                      else:
                          recovered = latest_verified_artifact(issue, base_sha)
                          if recovered is not None:
                              recovered_run, artifact = recovered
                              source_run_id = int(recovered_run.get("id") or 0)
                              pr_number = publish_artifact(recovered_run, issue, artifact)
                              action = f"published_pr_{pr_number}"
                          elif dispatch_retry(issue, base_sha, FailureClass.UNKNOWN, None):
                              action = "silent_stop_retry_dispatched"
                          else:
                              action = "silent_stop_already_recorded"
                      break

          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Bounded Queue recovery\n\n")
              summary.write(f"- action: `{action}`\n")
              summary.write(f"- issue: `{int(selected_issue['number']) if selected_issue else 'none'}`\n")
              summary.write(f"- source_run: `{source_run_id or 'none'}`\n")
              summary.write(f"- exact_default_sha: `{base_sha}`\n")
              summary.write("- candidate_execution_with_write_token: `false`\n")
              summary.write("- notification: `false`\n")
              summary.write("- human_action_required: `false`\n")
          PY
