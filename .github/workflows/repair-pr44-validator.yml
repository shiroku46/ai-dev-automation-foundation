name: Repair PR 44 Validator Alignment

on:
  push:
    branches: [main]
  schedule:
    - cron: "53 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: repair-pr-44-validator-alignment
  cancel-in-progress: false

jobs:
  repair:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: read
    env:
      TARGET_PR: "44"
      TARGET_BRANCH: fix/issue-36-human-notice-contract
      EXPECTED_HEAD: 3fb2f1ac2cc01aa45454d27359e2c594b38bd60b
      TARGET_PATH: scripts/validate_repository.py
    steps:
      - name: Apply immutable validator alignment repair
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess

          repository = os.environ["GITHUB_REPOSITORY"]
          pr_number = int(os.environ["TARGET_PR"])
          target_branch = os.environ["TARGET_BRANCH"]
          expected_head = os.environ["EXPECTED_HEAD"]
          target_path = os.environ["TARGET_PATH"]

          old = '''    stop = function_block(runtime, "stop_report", "format_human_only_notice")
              require_all(
                  stop,
                  ("self_resolution_audit", "persist_internal_stop_record", "_live_pr"),
                  "internal stop",
              )
              for forbidden in ("comment(", "ensure_label(", "--add-label", "/comments"):
          '''
          new = '''    stop = function_block(runtime, "stop_report", "format_human_only_notice")
              require_all(
                  stop,
                  (
                      "self_resolution_audit",
                      "persist_internal_stop_record",
                      "_revalidate_stop_reason",
                  ),
                  "internal stop",
              )
              revalidate = function_block(runtime, "_revalidate_stop_reason", "stop_report")
              require_all(
                  revalidate,
                  ("_live_pr", "source_and_scope"),
                  "live stop revalidation",
              )
              for forbidden in ("comment(", "ensure_label(", "--add-label", "/comments"):
          '''

          def gh(*args, input_value=None):
              result = subprocess.run(
                  ["gh", *args],
                  input=input_value,
                  text=True,
                  capture_output=True,
                  check=False,
              )
              if result.returncode != 0:
                  raise RuntimeError(
                      "gh command failed: " + " ".join(args) + "\n" + result.stderr.strip()
                  )
              return result.stdout

          def api(path):
              return json.loads(
                  gh("api", "-H", "Accept: application/vnd.github+json", path)
              )

          def api_json(method, path, payload):
              return json.loads(
                  gh(
                      "api",
                      "--method",
                      method,
                      "-H",
                      "Accept: application/vnd.github+json",
                      "--input",
                      "-",
                      path,
                      input_value=json.dumps(payload),
                  )
              )

          def require_target(snapshot):
              head = snapshot.get("head") or {}
              base = snapshot.get("base") or {}
              if snapshot.get("state") != "open":
                  print("Target Pull Request is no longer open; nothing to repair.")
                  raise SystemExit(0)
              if (head.get("repo") or {}).get("full_name") != repository:
                  raise RuntimeError("Target Pull Request head is not same-repository")
              if (base.get("repo") or {}).get("full_name") != repository:
                  raise RuntimeError("Target Pull Request base is not same-repository")
              if head.get("ref") != target_branch:
                  raise RuntimeError("Target Pull Request branch changed")
              if head.get("sha") != expected_head:
                  print("Target head moved; exact repair is no longer applicable.")
                  raise SystemExit(0)

          pull = api(f"repos/{repository}/pulls/{pr_number}")
          require_target(pull)
          commit = api(f"repos/{repository}/git/commits/{expected_head}")
          tree_sha = (commit.get("tree") or {}).get("sha")
          if not tree_sha:
              raise RuntimeError("Expected commit has no tree")
          tree = api(f"repos/{repository}/git/trees/{tree_sha}?recursive=1")
          entries = {
              item.get("path"): item
              for item in tree.get("tree") or []
              if item.get("path") == target_path
          }
          if set(entries) != {target_path}:
              raise RuntimeError("Expected tree lacks the exact validator path")
          entry = entries[target_path]
          if entry.get("type") != "blob" or entry.get("mode") not in {
              "100644",
              "100755",
          }:
              raise RuntimeError("Unexpected immutable validator file type or mode")

          metadata = api(f"repos/{repository}/contents/{target_path}?ref={expected_head}")
          if metadata.get("sha") != entry.get("sha") or metadata.get("encoding") != "base64":
              raise RuntimeError("Immutable validator blob/tree binding failed")
          encoded = "".join((metadata.get("content") or "").split())
          content = base64.b64decode(encoded.encode("ascii"), validate=True).decode("utf-8")
          if content.count(old) != 1:
              raise RuntimeError("Validator replacement anchor count is not exactly one")
          content = content.replace(old, new, 1)
          compile(content, target_path, "exec")

          blob = api_json(
              "POST",
              f"repos/{repository}/git/blobs",
              {"content": content, "encoding": "utf-8"},
          )
          new_tree = api_json(
              "POST",
              f"repos/{repository}/git/trees",
              {
                  "base_tree": tree_sha,
                  "tree": [
                      {
                          "path": target_path,
                          "mode": entry["mode"],
                          "type": "blob",
                          "sha": blob["sha"],
                      }
                  ],
              },
          )
          new_commit = api_json(
              "POST",
              f"repos/{repository}/git/commits",
              {
                  "message": "Align validator with live stop revalidation helper",
                  "tree": new_tree["sha"],
                  "parents": [expected_head],
              },
          )

          live = api(f"repos/{repository}/pulls/{pr_number}")
          require_target(live)
          api_json(
              "PATCH",
              f"repos/{repository}/git/refs/heads/{target_branch}",
              {"sha": new_commit["sha"], "force": False},
          )
          print(f"Repaired PR #{pr_number} to {new_commit['sha']}.")
          PY
