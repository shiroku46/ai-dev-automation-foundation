name: Claude Issue Queue
run-name: >-
  ${{ inputs.request_fingerprint && format('Optional Claude issue-{0} retry-{1} request-{2}', inputs.issue_number, inputs.retry_attempt, inputs.request_fingerprint) || (github.event_name == 'workflow_dispatch' && format('Optional Claude issue-{0} manual', inputs.issue_number) || (github.event.comment.body == '/claude-run' && format('Optional Claude issue-{0} trigger', github.event.issue.number) || format('Optional Claude ignored issue-{0}', github.event.issue.number || 'event'))) }}

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Trusted Issue number for an explicit optional provider run
        required: true
        type: string
      request_fingerprint:
        description: Exact trusted reconciliation retry fingerprint; blank only for owner-started runs
        required: false
        type: string
      retry_attempt:
        description: Exact trusted reconciliation retry attempt; blank only for owner-started runs
        required: false
        type: string

concurrency:
  group: optional-claude-${{ inputs.issue_number || github.event.issue.number }}
  cancel-in-progress: false

permissions: {}

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      issue_number: ${{ steps.guard.outputs.issue_number }}
      base_sha: ${{ steps.guard.outputs.base_sha }}
      contract_ok: ${{ steps.guard.outputs.contract_ok }}
      should_run: ${{ steps.guard.outputs.should_run }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: guard
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PATH: ${{ github.event_path }}
          DISPATCH_ISSUE: ${{ inputs.issue_number }}
          DISPATCH_FINGERPRINT: ${{ inputs.request_fingerprint }}
          DISPATCH_ATTEMPT: ${{ inputs.retry_attempt }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          OWNER: ${{ vars.AUTOMATION_OWNER || github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, re, subprocess, urllib.parse
          from pathlib import Path
          from scripts.queue_failure_classifier import (
              FailureClass,
              check_tool_permission_contract,
              should_auto_retry,
          )

          event = json.loads(Path(os.environ["EVENT_PATH"]).read_text(encoding="utf-8"))
          trigger = "/claude-run"
          actor = os.environ["ACTOR"].casefold()
          owner = os.environ["OWNER"].casefold()
          automation_actor = "github-actions[bot]"
          number = None
          allowed = False
          automated_retry = False

          def api(path):
              return json.loads(subprocess.check_output(
                  ["gh", "api", "-H", "Accept: application/vnd.github+json", path],
                  text=True,
              ))

          def api_pages(path):
              pages = json.loads(subprocess.check_output(
                  ["gh", "api", "-H", "Accept: application/vnd.github+json", "--paginate", "--slurp", path],
                  text=True,
              ))
              values = []
              for page in pages:
                  if not isinstance(page, list):
                      raise RuntimeError("paginated retry evidence is incomplete")
                  values.extend(page)
              return values

          def trigger_identity(issue):
              body = re.sub(r"<!--.*?-->", "", str(issue.get("body") or ""), flags=re.S)
              first = next((line.strip() for line in body.splitlines() if line.strip()), "")
              if first == trigger:
                  return {
                      "kind": "issue-body",
                      "id": int(issue.get("number") or 0),
                      "created_at": str(issue.get("created_at") or ""),
                  }
              comments = api_pages(
                  f"repos/{os.environ['REPOSITORY']}/issues/{int(issue['number'])}/comments?per_page=100"
              )
              matches = [
                  item for item in comments
                  if ((item.get("user") or {}).get("login") or "").casefold() == owner
                  and str(item.get("body") or "").strip() == trigger
              ]
              if not matches:
                  return None
              selected = max(
                  matches,
                  key=lambda item: (str(item.get("created_at") or ""), int(item.get("id") or 0)),
              )
              return {
                  "kind": "issue-comment",
                  "id": int(selected.get("id") or 0),
                  "created_at": str(selected.get("created_at") or ""),
                  "updated_at": str(selected.get("updated_at") or ""),
              }

          def request_fingerprint(issue, base_sha):
              identity = trigger_identity(issue)
              if identity is None or not identity.get("id") or not identity.get("created_at"):
                  raise RuntimeError("retry trigger identity is missing")
              payload = {
                  "base_sha": base_sha,
                  "issue_body": str(issue.get("body") or ""),
                  "issue_number": int(issue["number"]),
                  "issue_title": str(issue.get("title") or ""),
                  "trigger": identity,
              }
              raw = json.dumps(payload, sort_keys=True, separators=(",", ":")).encode("utf-8")
              return hashlib.sha256(raw).hexdigest()[:20]

          if os.environ["EVENT_NAME"] == "issue_comment":
              source = event.get("issue") or {}
              body = (event.get("comment") or {}).get("body") or ""
              number = source.get("number")
              allowed = actor == owner and not source.get("pull_request") and body.strip() == trigger
          elif os.environ["EVENT_NAME"] == "workflow_dispatch":
              raw = os.environ.get("DISPATCH_ISSUE", "")
              fingerprint_input = os.environ.get("DISPATCH_FINGERPRINT", "").strip()
              attempt_input = os.environ.get("DISPATCH_ATTEMPT", "").strip()
              number = int(raw) if raw.isdigit() else None
              base_conditions = (
                  os.environ.get("REF_NAME") == os.environ["DEFAULT_BRANCH"]
                  and isinstance(number, int)
                  and number > 0
              )
              if actor == owner and not fingerprint_input and not attempt_input:
                  allowed = base_conditions
              elif actor == automation_actor:
                  automated_retry = True
                  allowed = (
                      base_conditions
                      and os.environ.get("RUN_ATTEMPT") == "1"
                      and re.fullmatch(r"[0-9a-f]{20}", fingerprint_input) is not None
                      and attempt_input in {"1", "2", "3"}
                  )
          if not isinstance(number, int) or number <= 0:
              allowed = False

          base_sha = ""
          contract_ok = False
          issue = None
          if allowed:
              issue = api(f"repos/{os.environ['REPOSITORY']}/issues/{number}")
              allowed = (
                  issue.get("state") == "open"
                  and not issue.get("pull_request")
                  and ((issue.get("user") or {}).get("login") or "").casefold() == owner
              )
          if allowed:
              base_sha = api(
                  f"repos/{os.environ['REPOSITORY']}/commits/{os.environ['DEFAULT_BRANCH']}"
              )["sha"]
          if allowed and automated_retry:
              fingerprint = request_fingerprint(issue, base_sha)
              fingerprint_input = os.environ.get("DISPATCH_FINGERPRINT", "").strip()
              attempt = int(os.environ["DISPATCH_ATTEMPT"])
              if fingerprint_input != fingerprint:
                  allowed = False
              else:
                  record_root = (
                      f"automation-stops/queue-v4/issue-{number}/request-{fingerprint}"
                  )
                  encoded_root = urllib.parse.quote(record_root, safe="/")
                  listing = api(
                      f"repos/{os.environ['REPOSITORY']}/contents/{encoded_root}?ref=automation-internal-stops"
                  )
                  terminal = {
                      str(item.get("name") or "")
                      for item in listing if isinstance(listing, list)
                  } & {"internal-stop.json", "exhausted.json"}
                  if terminal:
                      allowed = False
                  else:
                      record_path = f"{record_root}/retry-{attempt}.json"
                      encoded = urllib.parse.quote(record_path, safe="/")
                      record_response = api(
                          f"repos/{os.environ['REPOSITORY']}/contents/{encoded}?ref=automation-internal-stops"
                      )
                      record = json.loads(base64.b64decode(
                          str(record_response.get("content") or "").replace("\n", "")
                      ))
                      try:
                          failure_class = FailureClass(str(record.get("failure_class") or ""))
                      except ValueError:
                          allowed = False
                      else:
                          allowed = (
                              record.get("attempt") == attempt
                              and record.get("base_sha") == base_sha
                              and record.get("issue_number") == number
                              and record.get("request_fingerprint") == fingerprint
                              and record.get("notification") is False
                              and record.get("human_action_required") is False
                              and record.get("next_automatic_action") == "dispatch one optional Queue retry"
                              and should_auto_retry(failure_class, attempt - 1, 3)
                          )
          if allowed:
              body = issue.get("body") or ""
              marker = re.search(
                  r"(?ms)<!--\s*foundation-provider-required-commands\s*\n(.*?)\n\s*-->", body
              )
              required = [] if marker is None else [
                  line.strip() for line in marker.group(1).splitlines() if line.strip()
              ]
              denied = check_tool_permission_contract(required, [])
              contract_ok = not denied
              if denied:
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
                      summary.write("## Optional provider preflight\n\n")
                      summary.write("- result: `contract_failed`\n")
                      summary.write(f"- denied_command_count: `{len(denied)}`\n")
                      summary.write("- model_invocation: `skipped`\n")
                      summary.write("- notification: false\n")
                      summary.write("- human_action_required: false\n")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"issue_number={number or ''}\n")
              output.write(f"base_sha={base_sha}\n")
              output.write(f"contract_ok={str(contract_ok).lower()}\n")
              output.write(f"should_run={str(allowed).lower()}\n")
          PY

  implement:
    needs: prepare
    if: needs.prepare.outputs.should_run == 'true' && needs.prepare.outputs.contract_ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      issues: read
      pull-requests: read
      actions: read
      id-token: write
    outputs:
      checkpoint_kind: ${{ steps.package.outputs.checkpoint_kind }}
      artifact_sha256: ${{ steps.package.outputs.artifact_sha256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Require immutable credential-free base
        env:
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$BASE_SHA"
          git config --local remote.origin.pushurl disabled://optional-provider-cannot-push
      - id: claude
        continue-on-error: true
        uses: anthropics/claude-code-action@787c5a0ce96a9a6cfb050ea0c8f4c05f2447c251
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          base_branch: ${{ github.event.repository.default_branch }}
          branch_prefix: claude-issue-${{ needs.prepare.outputs.issue_number }}-
          track_progress: false
          allowed_bots: github-actions
          prompt: |
            Implement Issue #${{ needs.prepare.outputs.issue_number }} exactly as written from immutable base ${{ needs.prepare.outputs.base_sha }}.
            Read AGENTS.md, CLAUDE.md, SECURITY.md, docs/PROJECT_STARTUP.md, and docs/OPERATING_RULES.md.
            Change only authorized paths. Do not push, merge, deploy, access another repository,
            reveal Secrets, execute repository code, or change repository settings.

            Automated retry attempt: `${{ inputs.retry_attempt || 'none' }}`.
            When the value is 1, 2, or 3, make the exact authorized implementation edit before broad exploration.
            Use only Read, Write, Edit, Glob, and Grep. Do not attempt Bash, git commands, or test execution.
            Trusted read-only verification runs after checkpoint creation.
            For an automated retry, reserve the final 8 turns for an exact path audit and durable checkpoint.
            For an owner-started route, reserve the final 5 turns for the same audit and checkpoint.
            Do not change any path outside the Issue allowlist.
            At the reserve threshold, stop editing and leave the best authorized worktree state.
          claude_args: |
            --max-turns 40
            --allowedTools "Read,Write,Edit,Glob,Grep"
      - id: package
        if: always() && steps.claude.outcome != 'skipped'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ISSUE_NUMBER: ${{ needs.prepare.outputs.issue_number }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
          CLAUDE_OUTCOME: ${{ steps.claude.outcome }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, re, stat, subprocess

          base = os.environ["BASE_SHA"]
          if subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip() != base:
              raise SystemExit("provider changed HEAD")
          issue = json.loads(subprocess.check_output(
              ["gh", "api", f"repos/{os.environ['REPOSITORY']}/issues/{os.environ['ISSUE_NUMBER']}"],
              text=True,
          ))
          match = re.search(
              r"(?ms)^## (?:Exact )?Allowed paths\s*\n(.*?)(?=^## |\Z)", issue.get("body") or ""
          )
          rules = [] if match is None else [
              line.strip()[2:].strip().strip("`")
              for line in match.group(1).splitlines() if line.strip().startswith("- ")
          ]
          def allowed(path):
              return any(
                  path == rule
                  or (rule.endswith("/**") and (
                      path == rule[:-3].rstrip("/")
                      or path.startswith(rule[:-3].rstrip("/") + "/")
                  )) for rule in rules
              )
          names = subprocess.check_output(
              ["git", "diff", "--name-only", "--no-renames", "-z", base, "--"]
          )
          names += subprocess.check_output(["git", "ls-files", "--others", "--exclude-standard", "-z"])
          paths = sorted({item.decode("utf-8") for item in names.split(b"\0") if item})
          if not paths or any(not allowed(path) for path in paths):
              raise SystemExit("empty or unauthorized checkpoint")
          for path in paths:
              disk = pathlib.Path(path)
              if disk.exists() and (disk.is_symlink() or not stat.S_ISREG(disk.stat(follow_symlinks=False).st_mode)):
                  raise SystemExit("checkpoint leaves must be regular files")
          untracked = [
              path for path in paths
              if subprocess.run(
                  ["git", "ls-files", "--error-unmatch", path],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              ).returncode != 0
          ]
          subprocess.check_call(["git", "add", "--all", "--", *paths])
          patch = subprocess.check_output(
              ["git", "diff", "--cached", "--binary", "--no-renames", base, "--"]
          )
          if not patch:
              raise SystemExit("empty staged checkpoint")
          checkpoint = {
              "version": 1,
              "base_sha": base,
              "checkpoint_kind": "complete" if os.environ["CLAUDE_OUTCOME"] == "success" else "wip",
              "retry_identity": f"run-{os.environ['RUN_ID']}-attempt-{os.environ['RUN_ATTEMPT']}",
              "changed_paths": paths,
              "patch_sha256": hashlib.sha256(patch).hexdigest(),
              "untracked": {path: hashlib.sha256(pathlib.Path(path).read_bytes()).hexdigest() for path in untracked},
          }
          target = pathlib.Path(os.environ["RUNNER_TEMP"]) / "queue-checkpoint"
          target.mkdir()
          (target / "candidate.patch").write_bytes(patch)
          (target / "checkpoint.json").write_text(json.dumps(checkpoint, sort_keys=True), encoding="utf-8")
          digest = hashlib.sha256((target / "checkpoint.json").read_bytes() + patch).hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"checkpoint_kind={checkpoint['checkpoint_kind']}\n")
              output.write(f"artifact_sha256={digest}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("## Optional provider checkpoint\n\n")
              summary.write(f"- checkpoint_kind: `{checkpoint['checkpoint_kind']}`\n")
              summary.write(f"- base_sha: `{base}`\n")
              summary.write(f"- diff_hash: `{digest}`\n")
              summary.write(f"- retry_identity: `{checkpoint['retry_identity']}`\n")
              summary.write(f"- changed_path_count: `{len(paths)}`\n")
              summary.write("- notification: false\n")
              summary.write("- human_action_required: false\n")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: steps.package.outcome == 'success'
        with:
          name: queue-${{ steps.package.outputs.checkpoint_kind }}-${{ github.run_id }}
          path: ${{ runner.temp }}/queue-checkpoint
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: [prepare, implement]
    if: needs.implement.outputs.checkpoint_kind == 'complete'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ needs.prepare.outputs.base_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: queue-complete-${{ github.run_id }}
          path: ${{ runner.temp }}/queue-checkpoint
      - name: Verify and apply immutable patch
        env:
          EXPECTED_DIGEST: ${{ needs.implement.outputs.artifact_sha256 }}
          BASE_SHA: ${{ needs.prepare.outputs.base_sha }}
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib
          root = pathlib.Path(os.environ["RUNNER_TEMP"]) / "queue-checkpoint"
          raw = (root / "checkpoint.json").read_bytes()
          patch = (root / "candidate.patch").read_bytes()
          if hashlib.sha256(raw + patch).hexdigest() != os.environ["EXPECTED_DIGEST"]:
              raise SystemExit("checkpoint digest mismatch")
          data = json.loads(raw)
          if data.get("base_sha") != os.environ["BASE_SHA"] or hashlib.sha256(patch).hexdigest() != data.get("patch_sha256"):
              raise SystemExit("checkpoint identity mismatch")
          PY
          git apply --index "$RUNNER_TEMP/queue-checkpoint/candidate.patch"
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - run: python scripts/public_export_guard.py .
      - run: python scripts/validate_repository.py
      - run: |
          if [ -d tests ]; then python -m unittest discover -s tests; fi

  publish:
    needs: [prepare, implement, verify]
    if: needs.verify.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Preserve verified candidate for GitHub-direct publication
        run: |
          {
            echo "## Verified optional-provider candidate"
            echo "- exact_base_sha: \`${{ needs.prepare.outputs.base_sha }}\`"
            echo "- artifact_sha256: \`${{ needs.implement.outputs.artifact_sha256 }}\`"
            echo "- publication_route: GitHub-direct coordinator"
            echo "- repository_write: false"
            echo "- human_action_required: false"
          } >> "$GITHUB_STEP_SUMMARY"

  finalize:
    needs: [prepare, implement, verify, publish]
    if: always() && needs.prepare.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Record public-safe optional route state
        env:
          CONTRACT_OK: ${{ needs.prepare.outputs.contract_ok }}
          IMPLEMENT_RESULT: ${{ needs.implement.result }}
          CHECKPOINT_KIND: ${{ needs.implement.outputs.checkpoint_kind }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          PUBLISH_RESULT: ${{ needs.publish.result }}
        run: |
          {
            echo "## Optional Claude route"
            echo "- contract_ok: \`${CONTRACT_OK:-false}\`"
            echo "- implementation_result: \`${IMPLEMENT_RESULT:-skipped}\`"
            echo "- checkpoint_kind: \`${CHECKPOINT_KIND:-none}\`"
            echo "- verify_result: \`${VERIFY_RESULT:-skipped}\`"
            echo "- publish_result: \`${PUBLISH_RESULT:-skipped}\`"
            echo "- notification: false"
            echo "- human_action_required: false"
            echo "- next_action: Continue GitHub-direct work when this optional route is unavailable."
          } >> "$GITHUB_STEP_SUMMARY"
